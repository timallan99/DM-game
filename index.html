<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Apple & Mobile Fullscreen Standalone App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sort & Learn">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Sort &amp; Learn: Food &amp; Vehicles</title>
  
  <style>
    /* CSS Variables for Seamless Dark/Light Mode Theming */
    :root, [data-theme="dark"] {
      --bg-body: #0b1120;
      --bg-header: #1e293b;
      --border-header: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      
      --btn-bg: #334155;
      --btn-border: #475569;
      --btn-text: #f8fafc;
      --btn-active: #1e293b;
      
      --zone-food-bg: #1c1917;
      --zone-food-border: #f59e0b;
      --zone-food-circle: #292524;
      --zone-food-circle-border: #78350f;
      --zone-food-heading: #fbbf24;
      --zone-food-sub: #fde68a;
      
      --zone-vehicle-bg: #082f49;
      --zone-vehicle-border: #38bdf8;
      --zone-vehicle-circle: #0c4a6e;
      --zone-vehicle-circle-border: #0369a1;
      --zone-vehicle-heading: #7dd3fc;
      --zone-vehicle-sub: #bae6fd;
      
      --zone-hover-bg: #064e3b;
      --zone-hover-border: #34d399;
      
      --dock-bg: #1e293b;
      --dock-border: #334155;
      --dock-pill-bg: #312e81;
      --dock-pill-border: #4338ca;
      --dock-pill-text: #e0e7ff;
      
      --card-bg: #0f172a;
      --card-border: #475569;
      --card-label: #e2e8f0;
      --card-shadow: rgba(0, 0, 0, 0.4);
      
      --modal-card-bg: #1e293b;
      --modal-overlay: rgba(11, 17, 32, 0.88);
      --overlay-bg: rgba(11, 17, 32, 0.96);
    }

    [data-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-header: #ffffff;
      --border-header: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #64748b;
      
      --btn-bg: #f8fafc;
      --btn-border: #cbd5e1;
      --btn-text: #1e293b;
      --btn-active: #e2e8f0;
      
      --zone-food-bg: #fffbeb;
      --zone-food-border: #d97706;
      --zone-food-circle: #fef3c7;
      --zone-food-circle-border: #fcd34d;
      --zone-food-heading: #92400e;
      --zone-food-sub: #b45309;
      
      --zone-vehicle-bg: #f0f9ff;
      --zone-vehicle-border: #0284c7;
      --zone-vehicle-circle: #e0f2fe;
      --zone-vehicle-circle-border: #bae6fd;
      --zone-vehicle-heading: #0369a1;
      --zone-vehicle-sub: #0284c7;
      
      --zone-hover-bg: #dcfce7;
      --zone-hover-border: #16a34a;
      
      --dock-bg: #ffffff;
      --dock-border: #cbd5e1;
      --dock-pill-bg: #e0e7ff;
      --dock-pill-border: #c7d2fe;
      --dock-pill-text: #3730a3;
      
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --card-label: #1e293b;
      --card-shadow: rgba(0, 0, 0, 0.12);
      
      --modal-card-bg: #ffffff;
      --modal-overlay: rgba(15, 23, 42, 0.65);
      --overlay-bg: rgba(255, 255, 255, 0.96);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Adapts seamlessly to Android address bar expanding and collapsing */
      overflow: hidden;
    }

    body {
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(6px, 1.5vw, 12px);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      width: 100%;
      max-width: 960px;
      margin: 0 auto clamp(4px, 1vw, 10px) auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: clamp(6px, 1.2vw, 10px) clamp(8px, 1.8vw, 14px);
      background: var(--bg-header);
      border-radius: clamp(12px, 2vw, 16px);
      border: 2px solid var(--border-header);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      min-width: 0;
    }

    .brand-icon {
      font-size: clamp(24px, 5vw, 32px);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: clamp(0.65rem, 1.8vw, 0.75rem);
      color: var(--text-sub);
      font-weight: 600;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: clamp(6px, 1.2vw, 8px) clamp(8px, 1.8vw, 12px);
      border-radius: clamp(8px, 1.5vw, 12px);
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 700;
      border: 1.5px solid var(--btn-border);
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-text);
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.95);
      background: var(--btn-active);
    }

    .btn-muted {
      opacity: 0.55;
    }

    /* On narrow phone screens, hide button text labels so they never wrap awkwardly */
    @media (max-width: 520px) {
      .brand-subtitle {
        display: none;
      }
      .btn .btn-text-label {
        display: none;
      }
      .btn {
        padding: 7px 10px;
        font-size: 1rem;
      }
    }

    main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 2vw, 16px);
      flex: 1 1 auto;
      min-height: 0;
      max-height: 52vh;
    }

    .category-zone {
      border: clamp(3px, 0.8vw, 4.5px) dashed var(--btn-border);
      border-radius: clamp(16px, 3.5vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(6px, 1.5vw, 14px);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .category-zone.zone-food {
      border-color: var(--zone-food-border);
      background: var(--zone-food-bg);
      box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.08);
    }

    .category-zone.zone-vehicle {
      border-color: var(--zone-vehicle-border);
      background: var(--zone-vehicle-bg);
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.08);
    }

    .zone-hovered {
      transform: scale(1.02);
      border-color: var(--zone-hover-border) !important;
      background: var(--zone-hover-bg) !important;
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.4) !important;
    }

    .zone-icon-circle {
      width: clamp(52px, 13vw, 84px);
      height: clamp(52px, 13vw, 84px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(32px, 8vw, 52px);
      margin-bottom: clamp(2px, 0.8vw, 6px);
      pointer-events: none;
      flex-shrink: 0;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .zone-food .zone-icon-circle { 
      background: var(--zone-food-circle); 
      border: 2px solid var(--zone-food-circle-border);
    }
    
    .zone-vehicle .zone-icon-circle { 
      background: var(--zone-vehicle-circle); 
      border: 2px solid var(--zone-vehicle-circle-border);
    }

    .zone-heading {
      font-size: clamp(1rem, 3.8vw, 1.4rem);
      font-weight: 800;
      pointer-events: none;
      line-height: 1.15;
    }

    .zone-food .zone-heading { color: var(--zone-food-heading); }
    .zone-vehicle .zone-heading { color: var(--zone-vehicle-heading); }

    .zone-sub {
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      font-weight: 600;
      margin-top: 2px;
      pointer-events: none;
      line-height: 1.15;
    }

    .zone-food .zone-sub { color: var(--zone-food-sub); }
    .zone-vehicle .zone-sub { color: var(--zone-vehicle-sub); }

    .zone-icon-circle img {
      width: clamp(36px, 9vw, 56px);
      height: clamp(36px, 9vw, 56px);
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }

    section#dockContainer {
      width: 100%;
      max-width: 960px;
      margin: clamp(4px, 1vw, 10px) auto 0 auto;
      background: var(--dock-bg);
      border: 2px solid var(--dock-border);
      border-radius: clamp(16px, 3vw, 22px);
      padding: clamp(8px, 1.5vw, 12px) clamp(10px, 2vw, 14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.65rem, 2vw, 0.72rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-sub);
      padding: 0 4px;
    }

    .counter-pill {
      background: var(--dock-pill-bg);
      color: var(--dock-pill-text);
      border: 1px solid var(--dock-pill-border);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: clamp(0.65rem, 1.8vw, 0.72rem);
    }

    #itemsDock {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      padding: 4px 0;
    }

    /* Cards adapt fluidly between phone and iPad dimensions */
    .draggable-card {
      touch-action: none;
      cursor: grab;
      will-change: transform;
      width: clamp(72px, 20vw, 104px);
      height: clamp(72px, 20vw, 104px);
      border-radius: clamp(14px, 3vw, 20px);
      border: clamp(2.5px, 0.6vw, 3.5px) solid var(--card-border);
      background: var(--card-bg);
      box-shadow: 0 4px 12px var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.25s ease;
    }

    .draggable-card:active {
      cursor: grabbing;
    }

    .card-selected-glow {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.45), 0 8px 20px rgba(59, 130, 246, 0.35);
      transform: scale(1.08);
    }

    .card-icon {
      font-size: clamp(34px, 9vw, 50px);
      pointer-events: none;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: clamp(40px, 11vw, 58px);
    }

    .card-icon img {
      width: clamp(38px, 10vw, 54px);
      height: clamp(38px, 10vw, 54px);
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }

    .card-label {
      font-size: clamp(0.65rem, 2.2vw, 0.75rem);
      font-weight: 700;
      color: var(--card-label);
      margin-top: 3px;
      pointer-events: none;
      text-align: center;
      line-height: 1.1;
      padding: 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    #bslModal {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }

    #bslModal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #bslCard {
      background: var(--modal-card-bg);
      border-radius: 24px;
      padding: clamp(14px, 4vw, 22px);
      max-width: 310px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.45);
      border: 4px solid #10b981;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #bslModal.active #bslCard {
      transform: scale(1);
    }

    @keyframes bslThankYouSign {
      0%, 20% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      70%, 100% {
        transform: translate(-34px, 40px) rotate(-14deg);
      }
    }

    .signing-arm-group {
      transform-origin: 150px 150px;
      animation: bslThankYouSign 1.4s ease-in-out infinite;
    }

    #celebrationOverlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #celebrationOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #confettiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .celebration-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .celebration-title {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 900;
      color: var(--text-main);
    }

    .celebration-btn {
      margin-top: 20px;
      padding: 14px 32px;
      background: #10b981;
      color: #ffffff;
      font-size: clamp(1.1rem, 3.5vw, 1.25rem);
      font-weight: 800;
      border: none;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.45);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .celebration-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">👋</span>
      <div>
        <h1 class="brand-title">Sort &amp; Learn</h1>
        <p class="brand-subtitle">Drag or tap to sort</p>
      </div>
    </div>
    
    <div class="controls">
      <button id="themeToggleBtn" class="btn" aria-label="Toggle Dark and Light theme">
        <span id="themeIcon">☀️</span>
        <span id="themeLabel" class="btn-text-label">Light</span>
      </button>

      <button id="fullscreenBtn" class="btn" aria-label="Toggle Fullscreen">
        <span id="fullscreenIcon">⛶</span>
        <span id="fullscreenLabel" class="btn-text-label">Fullscreen</span>
      </button>

      <button id="soundToggleBtn" class="btn" aria-label="Toggle Sound">
        <span id="soundIcon">🔊</span>
        <span id="soundLabel" class="btn-text-label">Sound</span>
      </button>

      <button id="resetButton" class="btn" aria-label="Reset Game">
        <span>🔄</span>
        <span class="btn-text-label">Reset</span>
      </button>
    </div>
  </header>

  <main>
    <div id="zone-food" data-category="food" class="category-zone zone-food">
      <div class="zone-icon-circle">
        <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f34e.svg" alt="Food" onerror="this.onerror=null;this.replaceWith('🍎')" draggable="false">
      </div>
      <h2 class="zone-heading">Food</h2>
      <p class="zone-sub">Things we eat</p>
    </div>

    <div id="zone-vehicle" data-category="vehicle" class="category-zone zone-vehicle">
      <div class="zone-icon-circle">
        <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f697.svg" alt="Vehicles" onerror="this.onerror=null;this.replaceWith('🚗')" draggable="false">
      </div>
      <h2 class="zone-heading">Vehicles</h2>
      <p class="zone-sub">Things that travel</p>
    </div>
  </main>

  <section id="dockContainer">
    <div class="dock-header">
      <span>Items to sort</span>
      <span id="counterBadge" class="counter-pill">0 left</span>
    </div>
    <div id="itemsDock"></div>
  </section>

  <div id="bslModal">
    <div id="bslCard">
      <div style="width: clamp(140px, 38vw, 180px); height: clamp(140px, 38vw, 180px); margin: 0 auto 8px;">
        <svg style="width: 100%; height: 100%;" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="92" fill="#042f2e" stroke="#14b8a6" stroke-width="4"/>
          <path d="M 35 198 C 45 145, 155 145, 165 198 Z" fill="#0d9488"/>
          <path d="M 85 152 C 95 162, 105 162, 115 152" stroke="#115e59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <rect x="90" y="125" width="20" height="25" fill="#fdba74" rx="6"/>
          <circle cx="100" cy="88" r="42" fill="#fed7aa"/>
          <path d="M 60 85 C 60 50, 140 50, 140 85 C 140 68, 128 60, 100 60 C 72 60, 60 68, 60 85 Z" fill="#78350f"/>
          <path d="M 82 82 C 86 76, 92 76, 96 82" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M 104 82 C 108 76, 114 76, 118 82" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <ellipse cx="78" cy="94" rx="6" ry="3.5" fill="#fda4af" opacity="0.65"/>
          <ellipse cx="122" cy="94" rx="6" ry="3.5" fill="#fda4af" opacity="0.65"/>
          <path d="M 88 104 C 95 116, 105 116, 112 104" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <g class="signing-arm-group">
            <path d="M 152 170 Q 132 136 108 112" stroke="#fdba74" stroke-width="13" stroke-linecap="round" fill="none"/>
            <path d="M 106 114 L 95 98 C 98 92, 107 95, 110 102 L 117 110 Z" fill="#fdba74" stroke="#fb923c" stroke-width="1.5" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
      <h3 style="font-size: clamp(1.25rem, 4.5vw, 1.5rem); font-weight: 800; color: #10b981;">"Thank You!"</h3>
      <p style="font-size: clamp(0.7rem, 2.5vw, 0.8rem); font-weight: 600; color: #059669; margin-top: 4px;">BSL: Flat hand glides forward from chin</p>
    </div>
  </div>

  <div id="celebrationOverlay">
    <canvas id="confettiCanvas"></canvas>
    <div class="celebration-content">
      <div style="font-size: clamp(3.5rem, 12vw, 5rem); margin-bottom: 8px;">🌟 🎉 🌟</div>
      <h2 class="celebration-title">Brilliant Sorting!</h2>
      <p style="font-size: clamp(0.85rem, 3vw, 1rem); color: var(--text-sub); font-weight: 600; margin-top: 4px;">You sorted every single item!</p>
      <button id="playAgainBtn" class="celebration-btn">Play Again 🔄</button>
    </div>
  </div>

  <script>
    // --- DIRECT MP3 AUDIO CONFIGURATION ---
    const sounds = {
      select: new Audio('select.mp3'),
      correct: new Audio('correct.mp3'),
      incorrect: new Audio('incorrect.mp3'),
      fanfare: new Audio('fanfare.mp3')
    };

    let isMuted = false;

    function playSound(soundName) {
      if (isMuted) return;
      const audio = sounds[soundName];
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const soundIcon = document.getElementById('soundIcon');
      const soundLabel = document.getElementById('soundLabel');
      const btn = document.getElementById('soundToggleBtn');
      if (!isMuted) {
        soundIcon.textContent = '🔊';
        soundLabel.textContent = 'Sound';
        btn.classList.remove('btn-muted');
        playSound('select');
      } else {
        soundIcon.textContent = '🔇';
        soundLabel.textContent = 'Mute';
        btn.classList.add('btn-muted');
      }
    }

    // --- THEME TOGGLE WITH LOCALSTORAGE PERSISTENCE ---
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      
      if (theme === 'light') {
        icon.textContent = '🌙';
        label.textContent = 'Dark';
      } else {
        icon.textContent = '☀️';
        label.textContent = 'Light';
      }

      try {
        localStorage.setItem('sort_learn_theme', theme);
      } catch (e) {}
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme') || 'dark';
      const nextTheme = current === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      playSound('select');
    }

    function initTheme() {
      let savedTheme = 'dark';
      try {
        savedTheme = localStorage.getItem('sort_learn_theme') || 'dark';
      } catch (e) {}
      applyTheme(savedTheme);
    }

    // --- FULLSCREEN TOGGLE ---
    function toggleFullscreen() {
      const doc = document;
      const docEl = document.documentElement;

      const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
      const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      const exitFs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;

      if (!isFullscreen) {
        if (requestFs) {
          requestFs.call(docEl).catch(err => {
            console.log("Fullscreen request blocked or not supported:", err);
          });
        }
      } else {
        if (exitFs) {
          exitFs.call(doc).catch(err => {});
        }
      }
    }

    function updateFullscreenUI() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      const icon = document.getElementById('fullscreenIcon');
      const label = document.getElementById('fullscreenLabel');
      if (isFullscreen) {
        icon.textContent = '🗗';
        label.textContent = 'Exit';
      } else {
        icon.textContent = '⛶';
        label.textContent = 'Full';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    function getSvgEmojiImg(code, fallbackEmoji, altText) {
      const url = `https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/${code}.svg`;
      return `<img src="${url}" alt="${altText}" onerror="this.onerror=null;this.replaceWith('${fallbackEmoji}')" draggable="false" />`;
    }

    // Standardized vector illustrations across all operating systems
    const ITEM_BANK = {
      vehicles: [
        { id: 'v-car', label: 'Car', code: '1f697', emoji: '🚗', category: 'vehicle' },
        { id: 'v-police', label: 'Police Car', code: '1f693', emoji: '🚓', category: 'vehicle' },
        { id: 'v-ambulance', label: 'Ambulance', code: '1f691', emoji: '🚑', category: 'vehicle' },
        { id: 'v-fire', label: 'Fire Engine', code: '1f692', emoji: '🚒', category: 'vehicle' },
        { id: 'v-digger', label: 'Digger', code: '1f69c', emoji: '🚜', category: 'vehicle' },
        { id: 'v-bicycle', label: 'Bicycle', code: '1f6b2', emoji: '🚲', category: 'vehicle' }
      ],
      food: [
        { id: 'f-apple', label: 'Apple', code: '1f34e', emoji: '🍎', category: 'food' },
        { id: 'f-banana', label: 'Banana', code: '1f34c', emoji: '🍌', category: 'food' },
        { id: 'f-pizza', label: 'Pizza', code: '1f355', emoji: '🍕', category: 'food' },
        { id: 'f-carrot', label: 'Carrot', code: '1f955', emoji: '🥕', category: 'food' },
        { id: 'f-bread', label: 'Bread', code: '1f35e', emoji: '🍞', category: 'food' },
        { id: 'f-strawberry', label: 'Strawberry', code: '1f353', emoji: '🍓', category: 'food' }
      ]
    };

    // User preference: 2 per category = 4 cards total per round
    const ITEMS_PER_CATEGORY = 2;

    let currentItems = [];
    let selectedItemElement = null;
    let isProcessing = false;

    const itemsDock = document.getElementById('itemsDock');
    const counterBadge = document.getElementById('counterBadge');
    const bslModal = document.getElementById('bslModal');
    const celebrationOverlay = document.getElementById('celebrationOverlay');
    const zoneElements = document.querySelectorAll('.category-zone');

    function initGame() {
      isProcessing = false;
      celebrationOverlay.classList.remove('active');
      bslModal.classList.remove('active');
      stopConfettiFountains();
      deselectCard();
      itemsDock.innerHTML = '';

      const pickedVehicles = [...ITEM_BANK.vehicles]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      const pickedFood = [...ITEM_BANK.food]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      currentItems = [...pickedVehicles, ...pickedFood]
        .sort(() => Math.random() - 0.5);

      updateBadge();

      currentItems.forEach(item => {
        const card = createCardElement(item);
        itemsDock.appendChild(card);
      });
    }

    function updateBadge() {
      const count = itemsDock.children.length;
      counterBadge.textContent = `${count} left`;
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.dataset.category = item.category;
      card.className = 'draggable-card';
      card.innerHTML = `
        <span class="card-icon">${getSvgEmojiImg(item.code, item.emoji, item.label)}</span>
        <span class="card-label">${item.label}</span>
      `;
      setupPointerDragAndTap(card);
      return card;
    }

    function setupPointerDragAndTap(card) {
      let isDragging = false;
      let hasMovedSignificantly = false;
      let startX = 0, startY = 0;
      let activePointerId = null;

      card.addEventListener('pointerdown', (e) => {
        if (isProcessing || (e.button !== undefined && e.button !== 0)) return;
        isDragging = true;
        hasMovedSignificantly = false;
        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        card.style.transition = 'none';
        card.style.zIndex = '40';
      });

      card.addEventListener('pointermove', (e) => {
        if (!isDragging || e.pointerId !== activePointerId) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        if (Math.hypot(deltaX, deltaY) > 8) hasMovedSignificantly = true;
        
        card.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.08)`;
        highlightZoneUnderPoint(e.clientX, e.clientY, card);
      });

      const onPointerUp = (e) => {
        if (!isDragging || e.pointerId !== activePointerId) return;
        isDragging = false;
        clearZoneHighlights();
        
        try { card.releasePointerCapture(e.pointerId); } catch (err) {}
        card.style.zIndex = '10';

        if (!hasMovedSignificantly) {
          handleCardTap(card);
          card.style.transition = 'transform 0.2s ease';
          card.style.transform = 'translate(0px, 0px)';
          return;
        }

        card.style.pointerEvents = 'none';
        const elementBelow = document.elementFromPoint(e.clientX, e.clientY);
        card.style.pointerEvents = 'auto';

        const dropZone = elementBelow?.closest('.category-zone') || findZoneByBoundingBox(e.clientX, e.clientY);

        if (dropZone) {
          checkMatch(card, dropZone.dataset.category);
        } else {
          snapBack(card);
        }
      };

      card.addEventListener('pointerup', onPointerUp);
      card.addEventListener('pointercancel', onPointerUp);
    }

    function findZoneByBoundingBox(clientX, clientY) {
      for (const zone of zoneElements) {
        const rect = zone.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
          return zone;
        }
      }
      return null;
    }

    function highlightZoneUnderPoint(clientX, clientY, currentCard) {
      currentCard.style.pointerEvents = 'none';
      const targetZone = document.elementFromPoint(clientX, clientY)?.closest('.category-zone') || findZoneByBoundingBox(clientX, clientY);
      currentCard.style.pointerEvents = 'auto';

      zoneElements.forEach(zone => {
        zone.classList.toggle('zone-hovered', zone === targetZone);
      });
    }

    function clearZoneHighlights() {
      zoneElements.forEach(zone => zone.classList.remove('zone-hovered'));
    }

    function snapBack(card) {
      card.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      card.style.transform = 'translate(0px, 0px) scale(1)';
    }

    function handleCardTap(card) {
      if (selectedItemElement === card) {
        deselectCard();
      } else {
        deselectCard();
        selectedItemElement = card;
        card.classList.add('card-selected-glow');
        playSound('select');
      }
    }

    function deselectCard() {
      if (selectedItemElement) {
        selectedItemElement.classList.remove('card-selected-glow');
        selectedItemElement = null;
      }
    }

    zoneElements.forEach(zone => {
      zone.addEventListener('click', () => {
        if (selectedItemElement && !isProcessing) {
          checkMatch(selectedItemElement, zone.dataset.category);
        }
      });
    });

    function checkMatch(cardElement, targetCategory) {
      if (isProcessing) return;
      
      if (cardElement.dataset.category === targetCategory) {
        isProcessing = true;
        deselectCard();
        playSound('correct');
        
        cardElement.style.transition = 'all 0.25s ease';
        cardElement.style.transform = 'scale(0.01)';
        cardElement.style.opacity = '0';

        setTimeout(() => {
          cardElement.remove();
          updateBadge();
          showBslThankYouModal();
        }, 250);
      } else {
        snapBack(cardElement);
        deselectCard();
        playSound('incorrect');
      }
    }

    function showBslThankYouModal() {
      bslModal.classList.add('active');
      setTimeout(hideBslModal, 1900);
    }

    function hideBslModal() {
      bslModal.classList.remove('active');
      setTimeout(() => {
        isProcessing = false;
        if (itemsDock.children.length === 0) triggerGrandCelebration();
      }, 300);
    }

    function triggerGrandCelebration() {
      celebrationOverlay.classList.add('active');
      playSound('fanfare');
      startConfettiFountains();
    }

    // --- BUILT-IN SIDE CONFETTI FOUNTAIN ENGINE ---
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;
    let confettiParticles = [];
    let confettiAnimId = null;
    let fountainIntervalId = null;

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);

    const CONFETTI_COLORS = [
      '#f59e0b', '#ef4444', '#10b981', '#3b82f6', 
      '#ec4899', '#8b5cf6', '#06b6d4', '#facc15'
    ];

    function createFountainParticle(originX, originY, angleDeg) {
      const angleRad = (angleDeg * Math.PI) / 180;
      const speed = 15 + Math.random() * 11;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angleRad) * speed + (Math.random() - 0.5) * 3,
        vy: Math.sin(angleRad) * speed,
        gravity: 0.42,
        drag: 0.985,
        wobble: Math.random() * 10,
        wobbleSpeed: 0.08 + Math.random() * 0.06,
        size: 7 + Math.random() * 7,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        opacity: 1,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12
      };
    }

    function launchFountainBursts() {
      if (!confettiCanvas) return;
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;

      // Left fountain: shoots up and inwards toward the centre-right (~-60°)
      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.04, h * 0.95, -60 + (Math.random() - 0.5) * 26));
      }

      // Right fountain: shoots up and inwards toward the centre-left (~-120°)
      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.96, h * 0.95, -120 + (Math.random() - 0.5) * 26));
      }
    }

    function updateAndRenderConfetti() {
      if (!confettiCtx || !confettiCanvas) return;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rotation += p.rotationSpeed;

        if (p.y > confettiCanvas.height - 20) {
          p.opacity -= 0.035;
        }

        if (p.opacity <= 0 || p.y > confettiCanvas.height + 50) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.scale(Math.cos(p.wobble), 1);
        confettiCtx.fillStyle = p.color;
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0 || fountainIntervalId) {
        confettiAnimId = requestAnimationFrame(updateAndRenderConfetti);
      }
    }

    function startConfettiFountains() {
      stopConfettiFountains();
      resizeConfettiCanvas();
      
      // Launch initial strong bursts
      launchFountainBursts();
      launchFountainBursts();

      // Keep fountains blasting from both sides every 80ms for 2.8 seconds
      fountainIntervalId = setInterval(launchFountainBursts, 80);
      setTimeout(() => {
        if (fountainIntervalId) {
          clearInterval(fountainIntervalId);
          fountainIntervalId = null;
        }
      }, 2800);

      updateAndRenderConfetti();
    }

    function stopConfettiFountains() {
      if (fountainIntervalId) {
        clearInterval(fountainIntervalId);
        fountainIntervalId = null;
      }
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      confettiParticles = [];
      if (confettiCtx && confettiCanvas) {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    document.getElementById('playAgainBtn').addEventListener('click', initGame);
    document.getElementById('resetButton').addEventListener('click', initGame);
    document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);
    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

    initTheme();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
