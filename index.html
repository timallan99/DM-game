  <script>
    /* ============================================================
       ZERO-DEPENDENCY WEBGL 1.0 GPU PARTICLE ENGINE (#webglStage)
       - 22,000 particles (Level 1) / 26,000 particles (Level 2)
       - 1,500-particle 3D GPU shockwave + spark fountain on match
       - Theme-aware blending & palettes (Dark additive / Light alpha)
       - Strict try/catch everywhere so DOM gameplay can NEVER break
       ============================================================ */
    const WebGLParticleEngine = (() => {
      const canvas = document.getElementById('webglStage');
      let gl = null;
      let isAvailable = false;

      let assemblyProgram = null;
      let burstProgram = null;
      let assemblyBuffer = null;
      let burstBuffer = null;

      let assemblyCount = 0;
      let assemblyStartTime = 0;
      let assemblyActive = false;

      let burstCount = 0;
      let burstStartTime = 0;
      let burstActive = false;

      let rafId = null;
      let viewportW = window.innerWidth;
      let viewportH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function isLightThemeActive() {
        return document.body && document.body.getAttribute('data-theme') === 'light';
      }

      // Luminous additive palettes for Dark Mode
      const DARK_PALETTES = {
        food: [
          [0.98, 0.75, 0.14], // bright amber
          [0.96, 0.62, 0.04], // gold
          [1.00, 0.92, 0.56]  // pale gold spark
        ],
        vehicle: [
          [0.22, 0.74, 0.97], // electric cyan
          [0.05, 0.65, 0.91], // sky blue
          [0.75, 0.92, 1.00]  // ice blue spark
        ],
        clothes: [
          [0.78, 0.52, 0.99], // vibrant violet
          [0.90, 0.35, 0.92], // electric magenta
          [0.93, 0.85, 1.00]  // lavender spark
        ]
      };

      // High-contrast saturated jewel tones for Light Mode
      const LIGHT_PALETTES = {
        food: [
          [0.82, 0.34, 0.02], // deep burnt amber
          [0.70, 0.24, 0.03], // rich burnt orange
          [0.90, 0.48, 0.03]  // vivid marigold
        ],
        vehicle: [
          [0.01, 0.40, 0.72], // vivid cobalt
          [0.02, 0.52, 0.68], // deep teal blue
          [0.03, 0.28, 0.62]  // royal blue
        ],
        clothes: [
          [0.48, 0.12, 0.78], // rich royal purple
          [0.37, 0.07, 0.64], // deep violet
          [0.64, 0.18, 0.84]  // vivid amethyst
        ]
      };

      function getPalette(category) {
        const table = isLightThemeActive() ? LIGHT_PALETTES : DARK_PALETTES;
        return table[category] || table.vehicle;
      }

      // Standard GLSL ES 1.00 Vertex Shader: Holographic Zone Particle Assembly
      const ASSEMBLY_VS = `
        precision highp float;
        attribute vec3 aStartPos;
        attribute vec3 aTargetPos;
        attribute vec3 aColor;
        attribute vec4 aMeta; // x: delay, y: dur, z: swirl, w: size

        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uDpr;
        uniform float uPerspective;
        uniform float uFadeOutStart;
        uniform float uFadeOutDur;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float delay = aMeta.x;
          float dur = aMeta.y;
          float swirl = aMeta.z;
          float baseSize = aMeta.w;

          float t = clamp((uTime - delay) / dur, 0.0, 1.0);
          float ease = 1.0 - pow(1.0 - t, 3.0);

          vec3 pos = mix(aStartPos, aTargetPos, ease);

          // Swirl particles organically in 3D around the target as they converge
          float swirlEnv = sin(t * 3.14159265) * (1.0 - ease * 0.55);
          float angle = swirl * swirlEnv * 2.2;
          float c = cos(angle);
          float s = sin(angle);
          vec2 rel = pos.xy - aTargetPos.xy;
          pos.x = aTargetPos.x + rel.x * c - rel.y * s;
          pos.y = aTargetPos.y + rel.x * s + rel.y * c;
          pos.z += sin(t * 6.283185 + swirl * 4.0) * 32.0 * (1.0 - t);

          float camZ = uPerspective;
          float denom = max(95.0, camZ - pos.z);
          float scale = camZ / denom;

          vec2 screenPos = pos.xy * scale;
          vec2 ndc = vec2(
            screenPos.x / (uResolution.x * 0.5),
            -screenPos.y / (uResolution.y * 0.5)
          );

          gl_Position = vec4(ndc, clamp(-pos.z / 2600.0, -0.99, 0.99), 1.0);

          float fadeIn = smoothstep(0.0, 0.16, t);
          float fadeOut = 1.0 - smoothstep(uFadeOutStart, uFadeOutStart + uFadeOutDur, uTime);
          float nearCamFade = smoothstep(camZ - 35.0, camZ - 210.0, pos.z);

          // Crisp flash right as particles lock into the holographic perimeter
          float lockFlash = exp(-pow((t - 0.96) * 14.0, 2.0)) * 0.45;

          vColor = min(vec3(1.0), aColor + vec3(lockFlash * 0.35));
          vAlpha = fadeIn * fadeOut * nearCamFade * (0.88 + lockFlash);

          gl_PointSize = clamp(baseSize * scale * uDpr, 1.2, 22.0 * uDpr);
        }
      `;

      // Standard GLSL ES 1.00 Vertex Shader: 3D Correct-Match Shockwave & Spark Fountain
      const BURST_VS = `
        precision highp float;
        attribute vec3 aOrigin;
        attribute vec3 aVel;
        attribute vec3 aColor;
        attribute vec3 aMeta; // x: life, y: size, z: drag

        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uDpr;
        uniform float uPerspective;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          float life = aMeta.x;
          float t = clamp(uTime, 0.0, life);
          float progress = t / life;
          float drag = aMeta.z;

          float dragFactor = (1.0 - exp(-drag * t)) / drag;
          vec3 pos = aOrigin + aVel * dragFactor;
          pos.y += 240.0 * t * t;

          float camZ = uPerspective;
          float denom = max(95.0, camZ - pos.z);
          float scale = camZ / denom;

          vec2 screenPos = pos.xy * scale;
          vec2 ndc = vec2(
            screenPos.x / (uResolution.x * 0.5),
            -screenPos.y / (uResolution.y * 0.5)
          );

          gl_Position = vec4(ndc, clamp(-pos.z / 2600.0, -0.99, 0.99), 1.0);

          float fadeOut = pow(1.0 - progress, 1.55);
          float nearCamFade = smoothstep(camZ - 35.0, camZ - 210.0, pos.z);

          vColor = aColor;
          vAlpha = fadeOut * nearCamFade;
          gl_PointSize = clamp(aMeta.y * scale * (1.0 - progress * 0.45) * uDpr, 1.2, 26.0 * uDpr);
        }
      `;

      // Standard GLSL ES 1.00 Fragment Shader (Premultiplied Alpha Output for Clean Compositing)
      const PARTICLE_FS = `
        precision mediump float;
        uniform float uIsLight;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          if (vAlpha <= 0.004) discard;
          vec2 uv = gl_PointCoord - vec2(0.5);
          float d = length(uv);
          if (d > 0.5) discard;

          float glow = pow(1.0 - d * 2.0, 1.85);
          float core = smoothstep(0.24, 0.0, d);

          // Dark mode: hot luminous core; Light mode: rich jewel saturation with boosted alpha
          vec3 darkCol = mix(vColor, vec3(1.0, 1.0, 1.0), core * 0.65);
          vec3 lightCol = mix(vColor, min(vec3(1.0), vColor * 1.12), core * 0.25);
          vec3 finalCol = mix(darkCol, lightCol, uIsLight);

          float darkAlpha = clamp((glow * 0.76 + core * 0.42) * vAlpha, 0.0, 1.0);
          float lightAlpha = clamp((glow * 0.96 + core * 0.68) * vAlpha * 1.32, 0.0, 1.0);
          float alpha = mix(darkAlpha, lightAlpha, uIsLight);

          // Output premultiplied RGBA so canvas compositing is crystal-clear with zero black fringe
          gl_FragColor = vec4(finalCol * alpha, alpha);
        }
      `;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        if (!shader) return null;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.warn('WebGL shader compile warning:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function createProgram(vsSrc, fsSrc) {
        const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
        const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
        if (!vs || !fs) return null;
        const prog = gl.createProgram();
        if (!prog) return null;
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          console.warn('WebGL link warning:', gl.getProgramInfoLog(prog));
          gl.deleteProgram(prog);
          return null;
        }
        return prog;
      }

      function resize() {
        try {
          if (!canvas) return;
          viewportW = Math.max(1, window.innerWidth);
          viewportH = Math.max(1, window.innerHeight);
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(viewportW * dpr);
          canvas.height = Math.floor(viewportH * dpr);
          if (gl) {
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
          }
        } catch (err) {}
      }

      function init() {
        try {
          if (!canvas) return false;
          const opts = {
            alpha: true,
            premultipliedAlpha: true,
            antialias: false,
            depth: false
          };
          gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
          if (!gl) return false;

          assemblyProgram = createProgram(ASSEMBLY_VS, PARTICLE_FS);
          burstProgram = createProgram(BURST_VS, PARTICLE_FS);
          if (!assemblyProgram || !burstProgram) {
            gl = null;
            return false;
          }

          assemblyProgram.loc = {
            aStartPos: gl.getAttribLocation(assemblyProgram, 'aStartPos'),
            aTargetPos: gl.getAttribLocation(assemblyProgram, 'aTargetPos'),
            aColor: gl.getAttribLocation(assemblyProgram, 'aColor'),
            aMeta: gl.getAttribLocation(assemblyProgram, 'aMeta'),
            uTime: gl.getUniformLocation(assemblyProgram, 'uTime'),
            uResolution: gl.getUniformLocation(assemblyProgram, 'uResolution'),
            uDpr: gl.getUniformLocation(assemblyProgram, 'uDpr'),
            uPerspective: gl.getUniformLocation(assemblyProgram, 'uPerspective'),
            uFadeOutStart: gl.getUniformLocation(assemblyProgram, 'uFadeOutStart'),
            uFadeOutDur: gl.getUniformLocation(assemblyProgram, 'uFadeOutDur'),
            uIsLight: gl.getUniformLocation(assemblyProgram, 'uIsLight')
          };

          burstProgram.loc = {
            aOrigin: gl.getAttribLocation(burstProgram, 'aOrigin'),
            aVel: gl.getAttribLocation(burstProgram, 'aVel'),
            aColor: gl.getAttribLocation(burstProgram, 'aColor'),
            aMeta: gl.getAttribLocation(burstProgram, 'aMeta'),
            uTime: gl.getUniformLocation(burstProgram, 'uTime'),
            uResolution: gl.getUniformLocation(burstProgram, 'uResolution'),
            uDpr: gl.getUniformLocation(burstProgram, 'uDpr'),
            uPerspective: gl.getUniformLocation(burstProgram, 'uPerspective'),
            uIsLight: gl.getUniformLocation(burstProgram, 'uIsLight')
          };

          assemblyBuffer = gl.createBuffer();
          burstBuffer = gl.createBuffer();
          if (!assemblyBuffer || !burstBuffer) {
            gl = null;
            return false;
          }

          gl.enable(gl.BLEND);
          gl.clearColor(0, 0, 0, 0);
          resize();
          window.addEventListener('resize', resize);
          isAvailable = true;
          return true;
        } catch (err) {
          console.warn('WebGL gracefully degraded:', err);
          isAvailable = false;
          gl = null;
          return false;
        }
      }

      /**
       * Samples a point along a rounded rectangle perimeter centered at (cx, cy).
       */
      function sampleRoundedRectPoint(cx, cy, w, h, r, tNorm) {
        const hw = w * 0.5;
        const hh = h * 0.5;
        const cr = Math.min(r, hw * 0.45, hh * 0.45);
        const topLen = Math.max(1, w - 2 * cr);
        const sideLen = Math.max(1, h - 2 * cr);
        const arcLen = 0.5 * Math.PI * cr;
        const total = 2 * topLen + 2 * sideLen + 4 * arcLen;
        let d = tNorm * total;

        if (d < topLen) return [cx - hw + cr + d, cy - hh];
        d -= topLen;
        if (d < arcLen) {
          const a = -Math.PI * 0.5 + (d / arcLen) * Math.PI * 0.5;
          return [cx + hw - cr + Math.cos(a) * cr, cy - hh + cr + Math.sin(a) * cr];
        }
        d -= arcLen;
        if (d < sideLen) return [cx + hw, cy - hh + cr + d];
        d -= sideLen;
        if (d < arcLen) {
          const a = (d / arcLen) * Math.PI * 0.5;
          return [cx + hw - cr + Math.cos(a) * cr, cy + hh - cr + Math.sin(a) * cr];
        }
        d -= arcLen;
        if (d < topLen) return [cx + hw - cr - d, cy + hh];
        d -= topLen;
        if (d < arcLen) {
          const a = Math.PI * 0.5 + (d / arcLen) * Math.PI * 0.5;
          return [cx - hw + cr + Math.cos(a) * cr, cy + hh - cr + Math.sin(a) * cr];
        }
        d -= arcLen;
        if (d < sideLen) return [cx - hw, cy + hh - cr - d];
        d -= sideLen;
        const a = Math.PI + (d / arcLen) * Math.PI * 0.5;
        return [cx - hw + cr + Math.cos(a) * cr, cy - hh + cr + Math.sin(a) * cr];
      }

      /**
       * Spawns 22,000 particles (Level 1) or 26,000 particles (Level 2) from a diffuse 3D nebula
       * converging onto each active target zone's exact screen bounding box.
       */
      function triggerZoneAssembly(zoneDescriptors) {
        try {
          if (!isAvailable || !gl || !zoneDescriptors || !zoneDescriptors.length) return;

          const totalTarget = zoneDescriptors.length === 2 ? 22000 : 26000;
          const perZone = Math.floor(totalTarget / zoneDescriptors.length);
          const totalParticles = perZone * zoneDescriptors.length;
          const stride = 13; // 3 start + 3 target + 3 color + 4 meta
          const data = new Float32Array(totalParticles * stride);

          const halfW = viewportW * 0.5;
          const halfH = viewportH * 0.5;
          let offset = 0;

          zoneDescriptors.forEach((zd, zIdx) => {
            const palette = getPalette(zd.category);
            const rect = zd.rect;
            const cx = (rect.left + rect.width * 0.5) - halfW;
            const cy = (rect.top + rect.height * 0.5) - halfH;
            const w = Math.max(40, rect.width);
            const h = Math.max(40, rect.height);
            const cornerR = Math.min(26, w * 0.12);
            const ringR = Math.min(w, h) * 0.2;
            const ringCy = cy - h * 0.12;
            const zoneDelayBase = zIdx * 0.08;

            for (let i = 0; i < perZone; i++) {
              const u = i / perZone;
              let tx = cx;
              let ty = cy;
              let tz = 0;
              let pSize = 2.6 + Math.random() * 2.5;

              if (u < 0.44) {
                // Rounded perimeter outline
                const pt = sampleRoundedRectPoint(cx, cy, w, h, cornerR, Math.random());
                tx = pt[0] + (Math.random() - 0.5) * 6;
                ty = pt[1] + (Math.random() - 0.5) * 6;
                pSize = 2.8 + Math.random() * 3.0;
              } else if (u < 0.72) {
                // Interior holographic gridlines
                const cols = 6;
                const rows = 5;
                if (Math.random() < 0.5) {
                  const colIdx = Math.floor(Math.random() * (cols - 1)) + 1;
                  tx = cx - w * 0.46 + (colIdx / cols) * (w * 0.92);
                  ty = cy + (Math.random() - 0.5) * (h * 0.88);
                } else {
                  const rowIdx = Math.floor(Math.random() * (rows - 1)) + 1;
                  ty = cy - h * 0.44 + (rowIdx / rows) * (h * 0.88);
                  tx = cx + (Math.random() - 0.5) * (w * 0.90);
                }
                pSize = 2.0 + Math.random() * 2.0;
              } else if (u < 0.90) {
                // Central elevated 3D icon medallion ring
                const ang = Math.random() * Math.PI * 2;
                const rad = ringR + (Math.random() - 0.5) * 6;
                tx = cx + Math.cos(ang) * rad;
                ty = ringCy + Math.sin(ang) * rad;
                tz = 22;
                pSize = 2.6 + Math.random() * 2.8;
              } else {
                // Diffuse interior holo shimmer
                tx = cx + (Math.random() - 0.5) * (w * 0.88);
                ty = cy + (Math.random() - 0.5) * (h * 0.84);
                pSize = 1.9 + Math.random() * 2.2;
              }

              // 40% start behind/near viewer (+Z) rushing forward; 60% wide diffuse 3D cloud
              let sx, sy, sz;
              if (Math.random() < 0.4) {
                const ang = Math.random() * Math.PI * 2;
                const rad = Math.max(viewportW, viewportH) * (0.35 + Math.random() * 0.65);
                sx = Math.cos(ang) * rad;
                sy = Math.sin(ang) * rad;
                sz = 420 + Math.random() * 500;
              } else {
                sx = (Math.random() - 0.5) * viewportW * 1.9;
                sy = (Math.random() - 0.5) * viewportH * 1.9;
                sz = (Math.random() - 0.5) * 860 - 150;
              }

              const col = palette[Math.floor(Math.random() * palette.length)];
              const delay = zoneDelayBase + Math.random() * 0.24;
              const dur = 0.90 + Math.random() * 0.42;
              const swirl = (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.75);

              data[offset++] = sx;
              data[offset++] = sy;
              data[offset++] = sz;
              data[offset++] = tx;
              data[offset++] = ty;
              data[offset++] = tz;
              data[offset++] = col[0];
              data[offset++] = col[1];
              data[offset++] = col[2];
              data[offset++] = delay;
              data[offset++] = dur;
              data[offset++] = swirl;
              data[offset++] = pSize;
            }
          });

          assemblyCount = totalParticles;
          gl.bindBuffer(gl.ARRAY_BUFFER, assemblyBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);

          assemblyStartTime = performance.now();
          assemblyActive = true;
          startLoop();
        } catch (err) {
          console.warn('WebGL assembly skipped:', err);
          assemblyActive = false;
        }
      }

      /**
       * Fires a 1,500-particle 3D GPU shockwave ring + celebratory spark fountain.
       */
      function triggerCorrectBurst(clientX, clientY, category) {
        try {
          if (!isAvailable || !gl) return;

          const count = 1500;
          const stride = 12; // 3 origin + 3 vel + 3 color + 3 meta
          const data = new Float32Array(count * stride);

          const ox = clientX - viewportW * 0.5;
          const oy = clientY - viewportH * 0.5;
          const oz = 24;

          const lightMode = isLightThemeActive();
          const catPalette = getPalette(category);
          const burstColors = lightMode
            ? [
                [0.02, 0.56, 0.37],
                [0.02, 0.44, 0.30],
                [0.85, 0.47, 0.02],
                [0.92, 0.62, 0.04],
                catPalette[0],
                catPalette[1]
              ]
            : [
                [0.20, 0.83, 0.60],
                [0.06, 0.73, 0.51],
                [0.99, 0.88, 0.28],
                [1.00, 1.00, 1.00],
                catPalette[0],
                catPalette[2]
              ];

          let offset = 0;
          for (let i = 0; i < count; i++) {
            const isRing = i < count * 0.32;
            let vx, vy, vz, life, size, drag;

            if (isRing) {
              const ang = (i / (count * 0.32)) * Math.PI * 2 + (Math.random() - 0.5) * 0.12;
              const speed = 560 + Math.random() * 140;
              vx = Math.cos(ang) * speed;
              vy = Math.sin(ang) * speed;
              vz = (Math.random() - 0.5) * 90 + 110;
              life = 0.58 + Math.random() * 0.22;
              size = 4.2 + Math.random() * 3.4;
              drag = 2.6;
            } else {
              const theta = Math.random() * Math.PI * 2;
              const phi = Math.acos(2 * Math.random() - 1);
              const speed = 220 + Math.random() * 680;
              vx = Math.sin(phi) * Math.cos(theta) * speed;
              vy = Math.sin(phi) * Math.sin(theta) * speed - 95;
              vz = Math.cos(phi) * speed + 140;
              life = 0.65 + Math.random() * 0.55;
              size = 3.0 + Math.random() * 5.2;
              drag = 1.9 + Math.random() * 1.4;
            }

            const col = burstColors[Math.floor(Math.random() * burstColors.length)];

            data[offset++] = ox + (Math.random() - 0.5) * 14;
            data[offset++] = oy + (Math.random() - 0.5) * 14;
            data[offset++] = oz;
            data[offset++] = vx;
            data[offset++] = vy;
            data[offset++] = vz;
            data[offset++] = col[0];
            data[offset++] = col[1];
            data[offset++] = col[2];
            data[offset++] = life;
            data[offset++] = size;
            data[offset++] = drag;
          }

          burstCount = count;
          gl.bindBuffer(gl.ARRAY_BUFFER, burstBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);

          burstStartTime = performance.now();
          burstActive = true;
          startLoop();
        } catch (err) {
          console.warn('WebGL burst skipped:', err);
          burstActive = false;
        }
      }

      function startLoop() {
        if (!rafId) {
          rafId = requestAnimationFrame(render);
        }
      }

      function render(now) {
        rafId = null;
        try {
          if (!isAvailable || !gl) return;

          const lightMode = isLightThemeActive();
          // Premultiplied alpha blending: Dark = additive glow, Light = crisp source-over
          if (lightMode) {
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          } else {
            gl.blendFunc(gl.ONE, gl.ONE);
          }

          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          let keepGoing = false;

          if (assemblyActive) {
            const elapsed = (now - assemblyStartTime) * 0.001;
            const totalDuration = 1.92;
            if (elapsed < totalDuration) {
              keepGoing = true;
              gl.useProgram(assemblyProgram);
              const loc = assemblyProgram.loc;

              gl.uniform1f(loc.uTime, elapsed);
              gl.uniform2f(loc.uResolution, viewportW, viewportH);
              gl.uniform1f(loc.uDpr, dpr);
              gl.uniform1f(loc.uPerspective, 950.0);
              gl.uniform1f(loc.uFadeOutStart, 1.36);
              gl.uniform1f(loc.uFadeOutDur, 0.50);
              gl.uniform1f(loc.uIsLight, lightMode ? 1.0 : 0.0);

              gl.bindBuffer(gl.ARRAY_BUFFER, assemblyBuffer);
              const strideBytes = 13 * 4;
              gl.enableVertexAttribArray(loc.aStartPos);
              gl.vertexAttribPointer(loc.aStartPos, 3, gl.FLOAT, false, strideBytes, 0);
              gl.enableVertexAttribArray(loc.aTargetPos);
              gl.vertexAttribPointer(loc.aTargetPos, 3, gl.FLOAT, false, strideBytes, 12);
              gl.enableVertexAttribArray(loc.aColor);
              gl.vertexAttribPointer(loc.aColor, 3, gl.FLOAT, false, strideBytes, 24);
              gl.enableVertexAttribArray(loc.aMeta);
              gl.vertexAttribPointer(loc.aMeta, 4, gl.FLOAT, false, strideBytes, 36);

              gl.drawArrays(gl.POINTS, 0, assemblyCount);
            } else {
              assemblyActive = false;
            }
          }

          if (burstActive) {
            const elapsed = (now - burstStartTime) * 0.001;
            if (elapsed < 1.3) {
              keepGoing = true;
              gl.useProgram(burstProgram);
              const loc = burstProgram.loc;

              gl.uniform1f(loc.uTime, elapsed);
              gl.uniform2f(loc.uResolution, viewportW, viewportH);
              gl.uniform1f(loc.uDpr, dpr);
              gl.uniform1f(loc.uPerspective, 950.0);
              gl.uniform1f(loc.uIsLight, lightMode ? 1.0 : 0.0);

              gl.bindBuffer(gl.ARRAY_BUFFER, burstBuffer);
              const strideBytes = 12 * 4;
              gl.enableVertexAttribArray(loc.aOrigin);
              gl.vertexAttribPointer(loc.aOrigin, 3, gl.FLOAT, false, strideBytes, 0);
              gl.enableVertexAttribArray(loc.aVel);
              gl.vertexAttribPointer(loc.aVel, 3, gl.FLOAT, false, strideBytes, 12);
              gl.enableVertexAttribArray(loc.aColor);
              gl.vertexAttribPointer(loc.aColor, 3, gl.FLOAT, false, strideBytes, 24);
              gl.enableVertexAttribArray(loc.aMeta);
              gl.vertexAttribPointer(loc.aMeta, 3, gl.FLOAT, false, strideBytes, 36);

              gl.drawArrays(gl.POINTS, 0, burstCount);
            } else {
              burstActive = false;
            }
          }

          if (keepGoing) {
            rafId = requestAnimationFrame(render);
          }
        } catch (err) {
          console.warn('WebGL frame error:', err);
          assemblyActive = false;
          burstActive = false;
        }
      }

      return {
        init,
        triggerZoneAssembly,
        triggerCorrectBurst,
        isAvailable: () => isAvailable
      };
    })();

    /* ============================================================
       AUDIO ENGINE (LOCAL MP3 FILES + WEB AUDIO SYNTH FALLBACKS)
       ============================================================ */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (AudioCtor) {
          audioCtx = new AudioCtor();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    const soundFiles = {
      select: new Audio('select.mp3'),
      correct: new Audio('correct.mp3'),
      incorrect: new Audio('incorrect.mp3'),
      fanfare: new Audio('fanfare.mp3')
    };

    let isMuted = false;
    let roundDealTimers = [];

    function playTone(freq, type, duration, delay = 0, volume = 0.12) {
      try {
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(volume, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function playFunky3DIntro(zoneCount, cardCount) {
      if (isMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const now = ctx.currentTime;

        const sweepOsc = ctx.createOscillator();
        const sweepFilter = ctx.createBiquadFilter();
        const sweepGain = ctx.createGain();
        sweepOsc.type = 'sawtooth';
        sweepOsc.frequency.setValueAtTime(98, now + 0.02);
        sweepOsc.frequency.exponentialRampToValueAtTime(220, now + 0.35);
        sweepOsc.frequency.exponentialRampToValueAtTime(146.83, now + 0.72);

        sweepFilter.type = 'lowpass';
        sweepFilter.frequency.setValueAtTime(220, now + 0.02);
        sweepFilter.frequency.exponentialRampToValueAtTime(1850, now + 0.42);
        sweepFilter.frequency.exponentialRampToValueAtTime(460, now + 0.75);

        sweepGain.gain.setValueAtTime(0.001, now + 0.02);
        sweepGain.gain.linearRampToValueAtTime(0.075, now + 0.12);
        sweepGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

        sweepOsc.connect(sweepFilter);
        sweepFilter.connect(sweepGain);
        sweepGain.connect(ctx.destination);
        sweepOsc.start(now + 0.02);
        sweepOsc.stop(now + 0.88);

        const zoneChord = [293.66, 369.99, 440.00];
        for (let z = 0; z < zoneCount; z++) {
          const zStart = now + 0.90 + (z * 0.09);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(zoneChord[z % zoneChord.length] * 0.88, zStart);
          osc.frequency.exponentialRampToValueAtTime(zoneChord[z % zoneChord.length], zStart + 0.09);
          gain.gain.setValueAtTime(0.065, zStart);
          gain.gain.exponentialRampToValueAtTime(0.0001, zStart + 0.34);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(zStart);
          osc.stop(zStart + 0.36);
        }

        const pentatonic = [392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
        for (let i = 0; i < cardCount; i++) {
          const targetFreq = pentatonic[i % pentatonic.length];
          const t = now + 0.50 + (i * 0.115);
          const pluckOsc = ctx.createOscillator();
          const pluckGain = ctx.createGain();
          pluckOsc.type = 'triangle';
          pluckOsc.frequency.setValueAtTime(targetFreq * 0.72, t);
          pluckOsc.frequency.exponentialRampToValueAtTime(targetFreq * 1.06, t + 0.06);
          pluckOsc.frequency.exponentialRampToValueAtTime(targetFreq, t + 0.14);

          pluckGain.gain.setValueAtTime(0.065, t);
          pluckGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

          pluckOsc.connect(pluckGain);
          pluckGain.connect(ctx.destination);
          pluckOsc.start(t);
          pluckOsc.stop(t + 0.26);
        }
      } catch (e) {}
    }

    function playSound(name) {
      if (isMuted) return;
      const file = soundFiles[name];
      if (file && file.src && !file.src.endsWith('.html')) {
        try {
          file.currentTime = 0;
          const p = file.play();
          if (p && typeof p.catch === 'function') {
            p.catch(() => playSyntheticSound(name));
          }
        } catch (e) {
          playSyntheticSound(name);
        }
      } else {
        playSyntheticSound(name);
      }
    }

    function playSyntheticSound(name) {
      if (name === 'select') {
        playTone(540, 'sine', 0.08, 0, 0.1);
      } else if (name === 'correct') {
        playTone(523.25, 'triangle', 0.16, 0, 0.11);
        playTone(659.25, 'triangle', 0.18, 0.07, 0.11);
        playTone(783.99, 'sine', 0.24, 0.14, 0.12);
        playTone(1046.50, 'sine', 0.34, 0.21, 0.11);
      } else if (name === 'incorrect') {
        playTone(220, 'sawtooth', 0.18, 0, 0.1);
        playTone(180, 'sawtooth', 0.22, 0.12, 0.1);
      } else if (name === 'fanfare') {
        const melody = [
          { f: 523.25, t: 0.00, d: 0.16 },
          { f: 659.25, t: 0.12, d: 0.16 },
          { f: 783.99, t: 0.24, d: 0.18 },
          { f: 1046.50, t: 0.38, d: 0.55 }
        ];
        melody.forEach(n => {
          playTone(n.f, 'triangle', n.d, n.t, 0.12);
          playTone(n.f * 0.5, 'sine', n.d, n.t, 0.07);
        });
        playTone(659.25, 'sine', 0.55, 0.40, 0.08);
        playTone(783.99, 'sine', 0.55, 0.40, 0.08);
        playTone(1318.51, 'sine', 0.50, 0.44, 0.06);
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const soundIcon = document.getElementById('soundIcon');
      const soundLabel = document.getElementById('soundLabel');
      const btn = document.getElementById('soundToggleBtn');
      if (!soundIcon || !soundLabel || !btn) return;
      if (!isMuted) {
        soundIcon.textContent = '🔊';
        soundLabel.textContent = 'Sound';
        btn.classList.remove('btn-muted');
        playSound('select');
      } else {
        soundIcon.textContent = '🔇';
        soundLabel.textContent = 'Mute';
        btn.classList.add('btn-muted');
      }
    }

    /* ============================================================
       THEME & FULLSCREEN CONTROLS
       ============================================================ */
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');

      if (icon && label) {
        if (theme === 'light') {
          icon.textContent = '🌙';
          label.textContent = 'Dark';
        } else {
          icon.textContent = '☀️';
          label.textContent = 'Light';
        }
      }

      try {
        localStorage.setItem('sort_learn_theme', theme);
      } catch (e) {}
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme') || 'dark';
      const nextTheme = current === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      playSound('select');
    }

    function initTheme() {
      let savedTheme = 'dark';
      try {
        savedTheme = localStorage.getItem('sort_learn_theme') || 'dark';
      } catch (e) {}
      applyTheme(savedTheme);
    }

    function toggleFullscreen() {
      const doc = document;
      const docEl = document.documentElement;
      const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
      const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      const exitFs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;

      if (!isFullscreen) {
        if (requestFs) {
          requestFs.call(docEl).catch(() => {});
        }
      } else {
        if (exitFs) {
          exitFs.call(doc).catch(() => {});
        }
      }
    }

    function updateFullscreenUI() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      const icon = document.getElementById('fullscreenIcon');
      const label = document.getElementById('fullscreenLabel');
      if (!icon || !label) return;
      if (isFullscreen) {
        icon.textContent = '🗗';
        label.textContent = 'Exit';
      } else {
        icon.textContent = '⛶';
        label.textContent = 'Full';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    /* ============================================================
       CLINICAL SESSION REPORT ENGINE (SOAP DATA)
       ============================================================ */
    const CATEGORY_NAMES = {
      food: 'Food',
      vehicle: 'Vehicles',
      clothes: 'Clothes'
    };

    let sessionRounds = [];
    let currentRoundStats = null;
    let activeCardTouchStart = null;

    function createFreshRoundStats(level, totalItems) {
      return {
        roundNumber: sessionRounds.length + 1,
        level: level,
        categoriesCount: level === 1 ? 2 : 3,
        categoriesLabel: level === 1 ? 'Food, Vehicles' : 'Food, Vehicles, Clothes',
        totalItems: totalItems,
        startTime: Date.now(),
        firstInteractionTime: null,
        endTime: null,
        totalAttempts: 0,
        firstTrySuccesses: 0,
        attemptedCardIds: new Set(),
        errors: [],
        dragPlacements: 0,
        tapPlacements: 0,
        offTargetDrops: 0,
        decisionLatenciesMs: [],
        completed: false
      };
    }

    function markInteractionStart() {
      if (currentRoundStats && !currentRoundStats.firstInteractionTime) {
        currentRoundStats.firstInteractionTime = Date.now();
      }
      activeCardTouchStart = Date.now();
    }

    function recordPlacementAttempt(cardElement, targetZone, isCorrect, method) {
      if (!currentRoundStats) return;
      if (!currentRoundStats.firstInteractionTime) {
        currentRoundStats.firstInteractionTime = Date.now();
      }

      currentRoundStats.totalAttempts++;
      if (method === 'drag') {
        currentRoundStats.dragPlacements++;
      } else {
        currentRoundStats.tapPlacements++;
      }

      if (activeCardTouchStart) {
        const latency = Math.max(100, Date.now() - activeCardTouchStart);
        currentRoundStats.decisionLatenciesMs.push(latency);
        activeCardTouchStart = null;
      }

      const cardId = cardElement.id;
      const itemLabel = cardElement.dataset.label || cardId;
      const expectedCat = CATEGORY_NAMES[cardElement.dataset.category] || cardElement.dataset.category;
      const placedCat = CATEGORY_NAMES[targetZone.dataset.category] || targetZone.dataset.category;

      const isFirstTryForThisCard = !currentRoundStats.attemptedCardIds.has(cardId);
      currentRoundStats.attemptedCardIds.add(cardId);

      if (isCorrect) {
        if (isFirstTryForThisCard) {
          currentRoundStats.firstTrySuccesses++;
        }
      } else {
        currentRoundStats.errors.push({
          itemLabel,
          expectedCat,
          placedCat
        });
      }
    }

    function recordOffTargetDrop() {
      if (!currentRoundStats) return;
      currentRoundStats.offTargetDrops++;
    }

    function finalizeCurrentRound() {
      if (!currentRoundStats || currentRoundStats.completed) return;
      currentRoundStats.endTime = Date.now();
      currentRoundStats.completed = true;
      sessionRounds.push(currentRoundStats);
    }

    function formatDuration(ms) {
      const totalSec = Math.max(1, Math.round(ms / 1000));
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return mins > 0 ? `${mins}m${secs}s` : `${secs}s`;
    }

    function generateClinicalReportText() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      const allRoundsToReport = [...sessionRounds];
      const dockEl = document.getElementById('itemsDock');
      const remaining = dockEl ? dockEl.children.length : 0;

      if (currentRoundStats && !currentRoundStats.completed && currentRoundStats.totalAttempts > 0) {
        allRoundsToReport.push({
          ...currentRoundStats,
          endTime: Date.now(),
          inProgress: true,
          sortedSoFar: currentRoundStats.totalItems - remaining
        });
      }

      if (allRoundsToReport.length === 0) {
        return `==================================================\nSESSION REPORT: SORT & LEARN\nDate: ${dateStr} (${timeStr})\n==================================================\n\nNo sorting attempts recorded in this session yet.\nSort items in the game and open this report at any time.`;
      }

      let totalDurationMs = 0;
      let totalItemsPossible = 0;
      let totalFirstTrySuccess = 0;
      let totalAttemptsAll = 0;
      let totalDragCount = 0;
      let totalTapCount = 0;
      let totalOffTarget = 0;

      let l1FirstTry = 0, l1Items = 0, l1Latencies = [];
      let l2FirstTry = 0, l2Items = 0, l2Latencies = [];
      let allErrors = [];

      const roundLines = allRoundsToReport.map((r, idx) => {
        const startRef = r.firstInteractionTime || r.startTime;
        const durMs = Math.max(1000, (r.endTime || Date.now()) - startRef);
        totalDurationMs += durMs;

        const itemsDenominator = r.inProgress ? Math.max(1, r.sortedSoFar) : r.totalItems;
        totalItemsPossible += itemsDenominator;
        totalFirstTrySuccess += r.firstTrySuccesses;
        totalAttemptsAll += r.totalAttempts;
        totalDragCount += r.dragPlacements;
        totalTapCount += r.tapPlacements;
        totalOffTarget += r.offTargetDrops;

        if (r.level === 1) {
          l1FirstTry += r.firstTrySuccesses;
          l1Items += itemsDenominator;
          l1Latencies.push(...r.decisionLatenciesMs);
        } else {
          l2FirstTry += r.firstTrySuccesses;
          l2Items += itemsDenominator;
          l2Latencies.push(...r.decisionLatenciesMs);
        }

        allErrors.push(...r.errors);

        const accPct = ((r.firstTrySuccesses / itemsDenominator) * 100).toFixed(1).replace(/\.0$/, '');
        const avgLatSec = r.decisionLatenciesMs.length > 0
          ? ((r.decisionLatenciesMs.reduce((a, b) => a + b, 0) / r.decisionLatenciesMs.length) / 1000).toFixed(1)
          : 'N/A';

        const totalInputs = r.dragPlacements + r.tapPlacements;
        let inputSummary = 'None';
        if (totalInputs > 0) {
          const tapPct = Math.round((r.tapPlacements / totalInputs) * 100);
          const dragPct = 100 - tapPct;
          if (tapPct === 100) inputSummary = '100% Tap-to-select';
          else if (dragPct === 100) inputSummary = '100% Drag-and-drop';
          else inputSummary = `${tapPct}% Tap / ${dragPct}% Drag`;
        }

        const errorDetails = r.errors.length === 0
          ? '0 errors'
          : `${r.errors.length} error(s): ` + r.errors.map(e => `${e.itemLabel} placed in ${e.placedCat}`).join('; ');

        const statusTag = r.inProgress ? ` [INCOMPLETE: ${r.sortedSoFar}/${r.totalItems} sorted]` : '';

        return [
          `Round ${idx + 1} (Level ${r.level} - ${r.totalItems} items: ${r.categoriesLabel})${statusTag}:`,
          `• Duration: ${formatDuration(durMs)} (avg action time: ${avgLatSec}s/attempt)`,
          `• First-Attempt Accuracy: ${accPct}% (${r.firstTrySuccesses}/${itemsDenominator})`,
          `• Total Attempts: ${r.totalAttempts} (${errorDetails})`,
          `• Input & Motor: ${inputSummary} | Off-target drops: ${r.offTargetDrops}`
        ].join('\n');
      });

      const overallAcc = ((totalFirstTrySuccess / Math.max(1, totalItemsPossible)) * 100).toFixed(1);
      const totalInputsSession = totalDragCount + totalTapCount;
      let sessionInputStr = 'N/A';
      if (totalInputsSession > 0) {
        const tapP = Math.round((totalTapCount / totalInputsSession) * 100);
        const dragP = 100 - tapP;
        sessionInputStr = `${tapP}% Tap-to-select, ${dragP}% Drag-and-drop`;
      }

      const avgL1Lat = l1Latencies.length > 0
        ? ((l1Latencies.reduce((a, b) => a + b, 0) / l1Latencies.length) / 1000).toFixed(1) + 's'
        : 'N/A';
      const avgL2Lat = l2Latencies.length > 0
        ? ((l2Latencies.reduce((a, b) => a + b, 0) / l2Latencies.length) / 1000).toFixed(1) + 's'
        : 'N/A';

      let errorPatternSummary = 'None (100% accuracy across all attempts)';
      if (allErrors.length > 0) {
        const counts = {};
        allErrors.forEach(e => {
          const key = `${e.itemLabel} (${e.expectedCat}) → ${e.placedCat}`;
          counts[key] = (counts[key] || 0) + 1;
        });
        errorPatternSummary = Object.entries(counts)
          .map(([k, v]) => `${k} (${v}x)`)
          .join(', ');
      }

      const loadLines = [];
      if (l1Items > 0) {
        const l1Pct = ((l1FirstTry / l1Items) * 100).toFixed(1);
        loadLines.push(`  - Level 1 (2 categories): ${l1Pct}% (${l1FirstTry}/${l1Items}) | Avg response: ${avgL1Lat}`);
      }
      if (l2Items > 0) {
        const l2Pct = ((l2FirstTry / l2Items) * 100).toFixed(1);
        loadLines.push(`  - Level 2 (3 categories): ${l2Pct}% (${l2FirstTry}/${l2Items}) | Avg response: ${avgL2Lat}`);
      }

      return [
        `==================================================`,
        `SESSION REPORT: SORT & LEARN`,
        `Date: ${dateStr} (${timeStr}) | Rounds Logged: ${allRoundsToReport.length}`,
        `Total Active Sorting Time: ${formatDuration(totalDurationMs)}`,
        `==================================================`,
        ``,
        `--- ROUND-BY-ROUND BREAKDOWN ---`,
        ``,
        roundLines.join('\n\n'),
        ``,
        `--- SESSION AGGREGATE SUMMARY (FOR SOAP NOTES) ---`,
        ``,
        `• Overall First-Attempt Accuracy: ${overallAcc}% (${totalFirstTrySuccess}/${totalItemsPossible} items correct on 1st try)`,
        `• Total Placements vs Target Items: ${totalAttemptsAll} attempts for ${totalItemsPossible} items`,
        `• Performance by Cognitive Load:`,
        ...loadLines,
        `• Misclassifications Logged: ${errorPatternSummary}`,
        `• Motor & Access Profile: ${sessionInputStr}; ${totalOffTarget} off-target drop(s)/snap-backs`,
        `==================================================`
      ].join('\n');
    }

    /**
     * Launches each 3D slab card along its own randomized 3D flight path
     * (from behind camera +Z, deep side arc -Z, or top-corner dive) and triggers
     * a prismatic foil sheen swipe as it lands.
     */
    function launchCard3DFlight(card, idx) {
      if (card._flightAnim) {
        try { card._flightAnim.cancel(); } catch (e) {}
        card._flightAnim = null;
      }

      const archetype = idx % 3;
      const side = idx % 2 === 0 ? -1 : 1;
      const duration = 840 + Math.floor(Math.random() * 420);
      const delay = 500 + idx * 115 + Math.floor(Math.random() * 50);

      let startTransform = '';
      let midTransform = '';

      if (archetype === 0) {
        // Swoop from behind the user (+Z) tumbling past the viewport edge
        const startX = side * (160 + Math.random() * 190);
        const startY = -120 - Math.random() * 130;
        const startZ = 460 + Math.random() * 200;
        const rx = (Math.random() > 0.5 ? 1 : -1) * (140 + Math.random() * 120);
        const ry = side * (220 + Math.random() * 180);
        const rz = side * (28 + Math.random() * 35);
        startTransform = `translate3d(${startX.toFixed(0)}px, ${startY.toFixed(0)}px, ${startZ.toFixed(0)}px) rotateX(${rx.toFixed(0)}deg) rotateY(${ry.toFixed(0)}deg) rotateZ(${rz.toFixed(0)}deg) scale3d(1.25, 1.25, 1)`;
        midTransform = `translate3d(${(-side * 12).toFixed(0)}px, -16px, 34px) rotateX(16deg) rotateY(${(-side * 14).toFixed(0)}deg) rotateZ(${(-side * 5).toFixed(0)}deg) scale3d(1.06, 1.06, 1)`;
      } else if (archetype === 1) {
        // Arc in from deep left/right -Z with multi-axis barrel roll
        const startX = side * (250 + Math.random() * 170);
        const startY = 80 + Math.random() * 110;
        const startZ = -420 - Math.random() * 170;
        const rx = -85 - Math.random() * 70;
        const ry = side * (420 + Math.random() * 180);
        const rz = side * (45 + Math.random() * 40);
        startTransform = `translate3d(${startX.toFixed(0)}px, ${startY.toFixed(0)}px, ${startZ.toFixed(0)}px) rotateX(${rx.toFixed(0)}deg) rotateY(${ry.toFixed(0)}deg) rotateZ(${rz.toFixed(0)}deg) scale3d(0.35, 0.35, 1)`;
        midTransform = `translate3d(0px, -22px, 42px) rotateX(18deg) rotateY(${(-side * 18).toFixed(0)}deg) rotateZ(${(-side * 6).toFixed(0)}deg) scale3d(1.08, 1.08, 1)`;
      } else {
        // Dive from top corners with front-flip & twist
        const startX = side * (170 + Math.random() * 170);
        const startY = -310 - Math.random() * 130;
        const startZ = 160 + Math.random() * 170;
        const rx = 280 + Math.random() * 140;
        const ry = side * (160 + Math.random() * 180);
        const rz = -side * (30 + Math.random() * 35);
        startTransform = `translate3d(${startX.toFixed(0)}px, ${startY.toFixed(0)}px, ${startZ.toFixed(0)}px) rotateX(${rx.toFixed(0)}deg) rotateY(${ry.toFixed(0)}deg) rotateZ(${rz.toFixed(0)}deg) scale3d(0.6, 0.6, 1)`;
        midTransform = `translate3d(0px, 8px, -16px) rotateX(-6deg) rotateY(${(side * 10).toFixed(0)}deg) rotateZ(2deg) scale3d(0.96, 0.96, 1)`;
      }

      const endTransform = 'translate3d(0px, 0px, 0px) rotateX(9deg) rotateY(0deg) rotateZ(0deg) scale3d(1, 1, 1)';

      const triggerSheen = () => {
        card.classList.remove('card-sheen-active');
        void card.offsetWidth;
        card.classList.add('card-sheen-active');
        const sheenTimer = setTimeout(() => {
          card.classList.remove('card-sheen-active');
        }, 760);
        roundDealTimers.push(sheenTimer);
      };

      if (typeof card.animate === 'function') {
        try {
          const anim = card.animate(
            [
              { opacity: 0, transform: startTransform, offset: 0 },
              { opacity: 1, transform: midTransform, offset: 0.72 },
              { opacity: 1, transform: endTransform, offset: 1 }
            ],
            {
              duration,
              delay,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'backwards'
            }
          );
          card._flightAnim = anim;
          anim.onfinish = () => {
            card._flightAnim = null;
            triggerSheen();
          };
          // Fallback cleanup in case onfinish is skipped
          roundDealTimers.push(setTimeout(() => {
            card._flightAnim = null;
          }, delay + duration + 120));
        } catch (err) {
          triggerSheen();
        }
      } else {
        triggerSheen();
      }
    }

    /**
     * Choreographs the full Hybrid 3D round-start sequence with guaranteed cleanup
     * on animationend AND fallback setTimeout timers so nothing can ever stay invisible.
     */
    function animateRoundStart(cardElements) {
      clearRoundEntranceTimers();

      const activeZones = getActiveZones();
      const zoneCount = activeZones.length;

      // Reset classes cleanly before measuring bounding boxes
      activeZones.forEach(zone => {
        zone.classList.remove('zone-assembling', 'zone-materializing', 'zone-shake', 'zone-hovered', 'zone-correct-burst');
        const iconCircle = zone.querySelector('.zone-icon-circle');
        if (iconCircle) iconCircle.classList.remove('icon-coin-spinning');
      });

      if (appHeader) appHeader.classList.remove('ui-fly-behind');
      if (dockContainer) dockContainer.classList.remove('dock-fly-behind');

      // Synchronous reflow for accurate bounding boxes and clean animation replays
      if (mainGrid) void mainGrid.offsetWidth;
      if (appHeader) void appHeader.offsetWidth;
      if (dockContainer) void dockContainer.offsetWidth;

      const zoneDescriptors = activeZones.map(zone => ({
        category: zone.dataset.category,
        rect: zone.getBoundingClientRect()
      }));

      // 1. Launch 22,000–26,000 GPU WebGL particles converging onto target zones
      const webglReady = WebGLParticleEngine.isAvailable();
      if (webglReady) {
        WebGLParticleEngine.triggerZoneAssembly(zoneDescriptors);
        activeZones.forEach(zone => zone.classList.add('zone-assembling'));
      }

      // 2. Exaggerated Behind-the-Camera UI Swoop (Header + Dock staggered by 120ms)
      if (appHeader) {
        const onHeaderEnd = (e) => {
          if (e.target === appHeader && e.animationName === 'headerFlyFromBehind') {
            appHeader.classList.remove('ui-fly-behind');
            appHeader.removeEventListener('animationend', onHeaderEnd);
          }
        };
        appHeader.addEventListener('animationend', onHeaderEnd);
        appHeader.classList.add('ui-fly-behind');
        roundDealTimers.push(setTimeout(() => {
          appHeader.classList.remove('ui-fly-behind');
          appHeader.removeEventListener('animationend', onHeaderEnd);
        }, 1100));
      }

      if (dockContainer) {
        const onDockEnd = (e) => {
          if (e.target === dockContainer && e.animationName === 'dockFlyFromBehind') {
            dockContainer.classList.remove('dock-fly-behind');
            dockContainer.removeEventListener('animationend', onDockEnd);
          }
        };
        dockContainer.addEventListener('animationend', onDockEnd);
        dockContainer.classList.add('dock-fly-behind');
        roundDealTimers.push(setTimeout(() => {
          dockContainer.classList.remove('dock-fly-behind');
          dockContainer.removeEventListener('animationend', onDockEnd);
        }, 1280));
      }

      // 3. Materialize DOM target zones with holographic scanline & 720-degree coin spin
      const materializeBase = webglReady ? 920 : 120;
      activeZones.forEach((zone, idx) => {
        const matTimer = setTimeout(() => {
          zone.classList.remove('zone-assembling');
          zone.classList.add('zone-materializing');

          const onZoneMatEnd = (e) => {
            if (e.target === zone && e.animationName === 'zoneHoloMaterialize') {
              zone.classList.remove('zone-materializing');
              zone.removeEventListener('animationend', onZoneMatEnd);
            }
          };
          zone.addEventListener('animationend', onZoneMatEnd);

          roundDealTimers.push(setTimeout(() => {
            zone.classList.remove('zone-assembling', 'zone-materializing');
            zone.removeEventListener('animationend', onZoneMatEnd);
          }, 760));

          const iconCircle = zone.querySelector('.zone-icon-circle');
          if (iconCircle) {
            const onCoinEnd = (e) => {
              if (e.target === iconCircle && e.animationName === 'icon3DCoinSpin') {
                iconCircle.classList.remove('icon-coin-spinning');
                iconCircle.removeEventListener('animationend', onCoinEnd);
              }
            };
            iconCircle.addEventListener('animationend', onCoinEnd);
            iconCircle.classList.add('icon-coin-spinning');

            roundDealTimers.push(setTimeout(() => {
              iconCircle.classList.remove('icon-coin-spinning');
              iconCircle.removeEventListener('animationend', onCoinEnd);
            }, 1350));
          }
        }, materializeBase + idx * 90);
        roundDealTimers.push(matTimer);
      });

      // 4. Launch chunky 3D slab cards along unique randomized trajectories
      cardElements.forEach((card, idx) => {
        launchCard3DFlight(card, idx);
      });

      // 5. Counter badge pop once cards land
      const badgePopTimer = setTimeout(() => {
        if (counterBadge) {
          counterBadge.classList.add('badge-pop');
          setTimeout(() => counterBadge.classList.remove('badge-pop'), 260);
        }
      }, 500 + cardElements.length * 115 + 780);
      roundDealTimers.push(badgePopTimer);

      // 6. Synced funky 3D synth intro
      playFunky3DIntro(zoneCount, cardElements.length);
    }

    function initGame() {
      isProcessing = false;
      if (celebrationOverlay) celebrationOverlay.classList.remove('active');
      if (bslModal) bslModal.classList.remove('active');
      stopConfettiFountains();
      deselectCard();
      if (itemsDock) itemsDock.innerHTML = '';

      if (currentLevel === 2) {
        if (clothesZone) clothesZone.classList.remove('zone-hidden');
        if (mainGrid) mainGrid.setAttribute('data-columns', '3');
      } else {
        if (clothesZone) clothesZone.classList.add('zone-hidden');
        if (mainGrid) mainGrid.setAttribute('data-columns', '2');
      }

      const pickedVehicles = [...ITEM_BANK.vehicles]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      const pickedFood = [...ITEM_BANK.food]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      let cardDeck = [...pickedVehicles, ...pickedFood];

      if (currentLevel === 2) {
        const pickedClothes = [...ITEM_BANK.clothes]
          .sort(() => Math.random() - 0.5)
          .slice(0, ITEMS_PER_CATEGORY);
        cardDeck.push(...pickedClothes);
      }

      currentItems = cardDeck.sort(() => Math.random() - 0.5);
      currentRoundStats = createFreshRoundStats(currentLevel, currentItems.length);

      const createdCards = currentItems.map(item => {
        const card = createCardElement(item);
        if (itemsDock) itemsDock.appendChild(card);
        return card;
      });

      updateBadge();
      animateRoundStart(createdCards);
    }

    function updateBadge() {
      if (!counterBadge || !itemsDock) return;
      const count = itemsDock.children.length;
      counterBadge.textContent = `${count} left`;
    }

    /**
     * Constructs a multi-layered chunky 3D slab card element.
     */
    function createCardElement(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.dataset.category = item.category;
      card.dataset.label = item.label;
      card.className = 'draggable-card';
      card.innerHTML = `
        <div class="card-ground-shadow" aria-hidden="true"></div>
        <div class="card-depth-layer card-depth-5" aria-hidden="true"></div>
        <div class="card-depth-layer card-depth-4" aria-hidden="true"></div>
        <div class="card-depth-layer card-depth-3" aria-hidden="true"></div>
        <div class="card-depth-layer card-depth-2" aria-hidden="true"></div>
        <div class="card-depth-layer card-depth-1" aria-hidden="true"></div>
        <div class="card-face-back" aria-hidden="true"></div>
        <div class="card-face-front">
          <div class="card-specular-clip" aria-hidden="true">
            <div class="card-specular"></div>
          </div>
          <span class="card-icon">${getSvgEmojiImg(item.code, item.emoji, item.label)}</span>
          <span class="card-label">${item.label}</span>
        </div>
      `;
      setupPointerDragAndTap(card);
      return card;
    }

    /* ============================================================
       POINTER DRAG-AND-DROP, LIVE 3D VELOCITY TILT & TAP-TO-SELECT
       ============================================================ */
    function setupPointerDragAndTap(card) {
      let isDragging = false;
      let hasMovedSignificantly = false;
      let startX = 0, startY = 0;
      let curDeltaX = 0, curDeltaY = 0;
      let lastX = 0, lastY = 0;
      let targetTiltX = 0, targetTiltY = 0;
      let curTiltX = 0, curTiltY = 0;
      let dragRafId = null;
      let activePointerId = null;

      const specularEl = card.querySelector('.card-specular');

      function updateDragTiltLoop() {
        if (!isDragging) {
          dragRafId = null;
          return;
        }
        curTiltX += (targetTiltX - curTiltX) * 0.24;
        curTiltY += (targetTiltY - curTiltY) * 0.24;
        targetTiltX *= 0.82;
        targetTiltY *= 0.82;

        card.style.transform = `translate3d(${curDeltaX.toFixed(1)}px, ${curDeltaY.toFixed(1)}px, 68px) rotateX(${curTiltX.toFixed(2)}deg) rotateY(${curTiltY.toFixed(2)}deg) scale3d(1.2, 1.2, 1)`;

        if (specularEl) {
          const sx = Math.max(5, Math.min(95, 50 - curTiltY * 1.8));
          const sy = Math.max(5, Math.min(95, 50 + curTiltX * 1.8));
          specularEl.style.setProperty('--sheen-x', `${sx.toFixed(0)}%`);
          specularEl.style.setProperty('--sheen-y', `${sy.toFixed(0)}%`);
        }

        dragRafId = requestAnimationFrame(updateDragTiltLoop);
      }

      card.addEventListener('pointermove', (e) => {
        if (isDragging) {
          if (e.pointerId !== activePointerId) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const vx = e.clientX - lastX;
          const vy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          curDeltaX = dx;
          curDeltaY = dy;

          if (Math.hypot(dx, dy) > 6) hasMovedSignificantly = true;

          targetTiltY = Math.max(-28, Math.min(28, vx * 1.65));
          targetTiltX = Math.max(-26, Math.min(26, -vy * 1.65));

          highlightZoneUnderPoint(e.clientX, e.clientY, card);
          return;
        }

        // Smooth interactive 3D tilt + dynamic specular glare on mouse hover
        if (e.pointerType === 'mouse' && !isProcessing && card !== selectedItemElement && !card._flightAnim) {
          const rect = card.getBoundingClientRect();
          const nx = ((e.clientX - rect.left) / rect.width) - 0.5;
          const ny = ((e.clientY - rect.top) / rect.height) - 0.5;
          const rx = (9 - ny * 18).toFixed(1);
          const ry = (nx * 20).toFixed(1);
          card.style.transition = 'transform 0.08s ease-out';
          card.style.transform = `translate3d(0px, -4px, 14px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.05, 1.05, 1)`;
          if (specularEl) {
            specularEl.style.setProperty('--sheen-x', `${((nx + 0.5) * 100).toFixed(0)}%`);
            specularEl.style.setProperty('--sheen-y', `${((ny + 0.5) * 100).toFixed(0)}%`);
          }
        }
      });

      card.addEventListener('pointerleave', () => {
        if (!isDragging && card !== selectedItemElement && !isProcessing) {
          card.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
          card.style.transform = 'translate3d(0px, 0px, 0px) rotateX(9deg) rotateY(0deg)';
          if (specularEl) {
            specularEl.style.setProperty('--sheen-x', '30%');
            specularEl.style.setProperty('--sheen-y', '20%');
          }
        }
      });

      card.addEventListener('pointerdown', (e) => {
        if (isProcessing || (e.button !== undefined && e.button !== 0)) return;
        markInteractionStart();

        if (card._flightAnim) {
          try { card._flightAnim.cancel(); } catch (err) {}
          card._flightAnim = null;
        }

        isDragging = true;
        hasMovedSignificantly = false;
        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        lastX = e.clientX;
        lastY = e.clientY;
        curDeltaX = 0;
        curDeltaY = 0;
        targetTiltX = 0;
        targetTiltY = 0;
        curTiltX = 6;
        curTiltY = 0;

        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        card.classList.add('card-dragging');
        card.style.transition = 'none';
        card.style.transform = 'translate3d(0px, 0px, 68px) rotateX(6deg) rotateY(0deg) scale3d(1.2, 1.2, 1)';

        if (!dragRafId) {
          dragRafId = requestAnimationFrame(updateDragTiltLoop);
        }
      });

      const onPointerUp = (e) => {
        if (!isDragging || e.pointerId !== activePointerId) return;
        isDragging = false;
        if (dragRafId) {
          cancelAnimationFrame(dragRafId);
          dragRafId = null;
        }
        card.classList.remove('card-dragging');
        clearZoneHighlights();

        try { card.releasePointerCapture(e.pointerId); } catch (err) {}

        if (!hasMovedSignificantly) {
          handleCardTap(card);
          card.style.transition = 'transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1)';
          if (card !== selectedItemElement) {
            card.style.transform = 'translate3d(0px, 0px, 0px) rotateX(9deg) rotateY(0deg)';
          } else {
            card.style.transform = '';
          }
          return;
        }

        card.style.pointerEvents = 'none';
        const elementBelow = document.elementFromPoint(e.clientX, e.clientY);
        card.style.pointerEvents = 'auto';

        const dropZone = elementBelow?.closest('.category-zone:not(.zone-hidden)') || findZoneByBoundingBox(e.clientX, e.clientY);

        if (dropZone) {
          checkMatch(card, dropZone, 'drag');
        } else {
          recordOffTargetDrop();
          snapBack(card);
        }
      };

      card.addEventListener('pointerup', onPointerUp);
      card.addEventListener('pointercancel', onPointerUp);
    }

    function findZoneByBoundingBox(clientX, clientY) {
      for (const zone of getActiveZones()) {
        const rect = zone.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
          return zone;
        }
      }
      return null;
    }

    function highlightZoneUnderPoint(clientX, clientY, currentCard) {
      currentCard.style.pointerEvents = 'none';
      const targetZone = document.elementFromPoint(clientX, clientY)?.closest('.category-zone:not(.zone-hidden)') || findZoneByBoundingBox(clientX, clientY);
      currentCard.style.pointerEvents = 'auto';

      getActiveZones().forEach(zone => {
        zone.classList.toggle('zone-hovered', zone === targetZone);
      });
    }

    function clearZoneHighlights() {
      getActiveZones().forEach(zone => zone.classList.remove('zone-hovered'));
    }

    function snapBack(card) {
      card.classList.remove('card-dragging');
      card.style.transition = 'transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1)';
      card.style.transform = 'translate3d(0px, 0px, 0px) rotateX(9deg) rotateY(0deg)';
    }

    function handleCardTap(card) {
      if (selectedItemElement === card) {
        deselectCard();
      } else {
        deselectCard();
        selectedItemElement = card;
        activeCardTouchStart = Date.now();
        card.style.transform = '';
        card.classList.add('card-selected-glow');
        playSound('select');
      }
    }

    function deselectCard() {
      if (selectedItemElement) {
        selectedItemElement.classList.remove('card-selected-glow');
        selectedItemElement.style.transform = 'translate3d(0px, 0px, 0px) rotateX(9deg) rotateY(0deg)';
        selectedItemElement = null;
      }
    }

    function triggerZoneShake(zone) {
      if (!zone) return;
      zone.classList.remove('zone-shake', 'zone-materializing', 'zone-correct-burst');
      void zone.offsetWidth;
      zone.classList.add('zone-shake');
      setTimeout(() => {
        zone.classList.remove('zone-shake');
      }, 480);
    }

    /* ============================================================
       CORRECT MATCH: 3D CORKSCREW SPIN + GPU BURST + BSL MODAL
       ============================================================ */
    function triggerTargetZone3DBurst(targetZone) {
      if (!targetZone) return;

      targetZone.classList.remove('zone-correct-burst', 'zone-materializing', 'zone-shake');
      void targetZone.offsetWidth;
      targetZone.classList.add('zone-correct-burst');
      setTimeout(() => {
        targetZone.classList.remove('zone-correct-burst');
      }, 660);

      const rect = targetZone.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;

      WebGLParticleEngine.triggerCorrectBurst(cx, cy, targetZone.dataset.category);
    }

    function checkMatch(cardElement, targetZone, method = 'tap') {
      if (isProcessing) return;

      const targetCategory = targetZone.dataset.category;
      const isCorrect = cardElement.dataset.category === targetCategory;

      recordPlacementAttempt(cardElement, targetZone, isCorrect, method);

      if (isCorrect) {
        isProcessing = true;
        deselectCard();
        playSound('correct');
        triggerTargetZone3DBurst(targetZone);

        const cardRect = cardElement.getBoundingClientRect();
        const zoneRect = targetZone.getBoundingClientRect();
        const currentMatrix = window.getComputedStyle(cardElement).transform;
        let curTx = 0, curTy = 0;
        if (currentMatrix && currentMatrix !== 'none') {
          try {
            const parsed = new DOMMatrixReadOnly(currentMatrix);
            curTx = parsed.m41;
            curTy = parsed.m42;
          } catch (e) {}
        }

        const deltaX = (zoneRect.left + zoneRect.width / 2) - (cardRect.left + cardRect.width / 2);
        const deltaY = (zoneRect.top + zoneRect.height / 2) - (cardRect.top + cardRect.height / 2);

        cardElement.style.zIndex = '65';
        cardElement.style.pointerEvents = 'none';
        cardElement.style.transition = 'transform 0.42s cubic-bezier(0.32, 0, 0.2, 1), opacity 0.38s ease';
        cardElement.style.transform = `translate3d(${(curTx + deltaX).toFixed(1)}px, ${(curTy + deltaY).toFixed(1)}px, 90px) rotateY(540deg) rotateX(180deg) rotateZ(24deg) scale3d(0.12, 0.12, 1)`;
        cardElement.style.opacity = '0';

        setTimeout(() => {
          cardElement.remove();
          updateBadge();
          if (itemsDock && itemsDock.children.length === 0) {
            finalizeCurrentRound();
          }
          showBslThankYouModal();
        }, 410);
      } else {
        snapBack(cardElement);
        deselectCard();
        triggerZoneShake(targetZone);
        playSound('incorrect');
      }
    }

    function showBslThankYouModal() {
      if (bslModal) bslModal.classList.add('active');
      setTimeout(hideBslModal, 2050);
    }

    function hideBslModal() {
      if (bslModal) bslModal.classList.remove('active');
      setTimeout(() => {
        isProcessing = false;
        if (itemsDock && itemsDock.children.length === 0) {
          triggerGrandCelebration();
        }
      }, 300);
    }

    function triggerGrandCelebration() {
      if (celebrationOverlay) celebrationOverlay.classList.add('active');
      playSound('fanfare');
      startConfettiFountains();
    }

    /* ============================================================
       DUAL SIDE CONFETTI FOUNTAINS (#confettiCanvas)
       ============================================================ */
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;
    let confettiParticles = [];
    let confettiAnimId = null;
    let fountainIntervalId = null;

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);

    const CONFETTI_COLORS = [
      '#f59e0b', '#ef4444', '#10b981', '#3b82f6',
      '#ec4899', '#8b5cf6', '#06b6d4', '#facc15'
    ];

    function createFountainParticle(originX, originY, angleDeg) {
      const angleRad = (angleDeg * Math.PI) / 180;
      const speed = 15 + Math.random() * 11;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angleRad) * speed + (Math.random() - 0.5) * 3,
        vy: Math.sin(angleRad) * speed,
        gravity: 0.42,
        drag: 0.985,
        wobble: Math.random() * 10,
        wobbleSpeed: 0.08 + Math.random() * 0.06,
        size: 7 + Math.random() * 7,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        opacity: 1,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12
      };
    }

    function launchFountainBursts() {
      if (!confettiCanvas) return;
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;
      const fountainY = h * 0.67;

      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.04, fountainY, -55 + (Math.random() - 0.5) * 28));
      }
      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.96, fountainY, -125 + (Math.random() - 0.5) * 28));
      }
    }

    function updateAndRenderConfetti() {
      if (!confettiCtx || !confettiCanvas) return;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rotation += p.rotationSpeed;

        if (p.y > confettiCanvas.height - 20) {
          p.opacity -= 0.035;
        }

        if (p.opacity <= 0 || p.y > confettiCanvas.height + 50) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.scale(Math.cos(p.wobble), 1);
        confettiCtx.fillStyle = p.color;
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0 || fountainIntervalId) {
        confettiAnimId = requestAnimationFrame(updateAndRenderConfetti);
      }
    }

    function startConfettiFountains() {
      stopConfettiFountains();
      resizeConfettiCanvas();

      launchFountainBursts();
      launchFountainBursts();

      fountainIntervalId = setInterval(launchFountainBursts, 80);
      setTimeout(() => {
        if (fountainIntervalId) {
          clearInterval(fountainIntervalId);
          fountainIntervalId = null;
        }
      }, 2800);

      updateAndRenderConfetti();
    }

    function stopConfettiFountains() {
      if (fountainIntervalId) {
        clearInterval(fountainIntervalId);
        fountainIntervalId = null;
      }
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      confettiParticles = [];
      if (confettiCtx && confettiCanvas) {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    /* ============================================================
       SAFE EVENT BINDINGS & RELIABLE INITIALIZATION
       ============================================================ */
    let hasBooted = false;

    function safeBindClick(id, handler) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', handler);
    }

    function bootApp() {
      if (hasBooted) return;
      hasBooted = true;

      safeBindClick('playAgainBtn', initGame);
      safeBindClick('resetButton', initGame);
      safeBindClick('soundToggleBtn', toggleSound);
      safeBindClick('themeToggleBtn', toggleTheme);
      safeBindClick('fullscreenBtn', toggleFullscreen);
      safeBindClick('levelToggleBtn', toggleLevel);

      safeBindClick('reportBtn', openReportModal);
      safeBindClick('celebrationReportBtn', openReportModal);
      safeBindClick('closeReportBtn', closeReportModal);
      safeBindClick('copyReportBtn', copyReportToClipboard);
      safeBindClick('clearSessionBtn', clearSessionHistory);

      document.querySelectorAll('.category-zone').forEach(zone => {
        zone.addEventListener('click', () => {
          if (selectedItemElement && !isProcessing && !zone.classList.contains('zone-hidden')) {
            checkMatch(selectedItemElement, zone, 'tap');
          }
        });
      });

      initTheme();
      WebGLParticleEngine.init();
      initGame();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
