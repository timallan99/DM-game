    /**
     * Choreographs the 20%-slower 3D round-start entrance across target zones,
     * 45%-slower category icon coin spins, 3D stage-lift dock, and vortex card deal.
     */
    function animateRoundStart(cardElements) {
      clearRoundEntranceTimers();

      const activeZones = getActiveZones();
      const zoneCount = activeZones.length;

      // Reset classes & assign directional 3D angles + 125ms stagger
      activeZones.forEach((zone, idx) => {
        zone.classList.remove('zone-entering', 'zone-shake', 'zone-hovered', 'zone-correct-burst');
        const iconCircle = zone.querySelector('.zone-icon-circle');
        if (iconCircle) iconCircle.classList.remove('icon-coin-spinning');

        let ry = -14;
        let rz = -5;
        if (zoneCount === 2) {
          ry = idx === 0 ? -16 : 16;
          rz = idx === 0 ? -5 : 5;
        } else if (zoneCount === 3) {
          if (idx === 0) { ry = -18; rz = -6; }
          else if (idx === 1) { ry = 0; rz = 0; }
          else { ry = 18; rz = 6; }
        }

        const delayVal = `${idx * 125}ms`;
        zone.style.setProperty('--zone-ry', `${ry}deg`);
        zone.style.setProperty('--zone-rz', `${rz}deg`);
        zone.style.setProperty('--zone-delay', delayVal);
        if (iconCircle) iconCircle.style.setProperty('--zone-delay', delayVal);
      });

      // Forced cross-browser reflow so Reset / Level Switch / Play Again always replay cleanly
      void mainGrid.offsetWidth;

      activeZones.forEach((zone, idx) => {
        const delayMs = idx * 125;
        const iconCircle = zone.querySelector('.zone-icon-circle');
        zone.classList.add('zone-entering');
        if (iconCircle) iconCircle.classList.add('icon-coin-spinning');

        const onZoneEnd = (e) => {
          if (e.target === zone && e.animationName === 'zone3DFunkEnter') {
            zone.classList.remove('zone-entering');
            zone.removeEventListener('animationend', onZoneEnd);
          }
        };
        zone.addEventListener('animationend', onZoneEnd);

        const zoneCleanupTimer = setTimeout(() => {
          zone.classList.remove('zone-entering');
          zone.removeEventListener('animationend', onZoneEnd);
        }, delayMs + 1080);
        roundDealTimers.push(zoneCleanupTimer);

        if (iconCircle) {
          const onCoinEnd = (e) => {
            if (e.target === iconCircle && e.animationName === 'icon3DCoinSpin') {
              iconCircle.classList.remove('icon-coin-spinning');
              iconCircle.removeEventListener('animationend', onCoinEnd);
            }
          };
          iconCircle.addEventListener('animationend', onCoinEnd);

          const coinCleanupTimer = setTimeout(() => {
            iconCircle.classList.remove('icon-coin-spinning');
            iconCircle.removeEventListener('animationend', onCoinEnd);
          }, delayMs + 1650);
          roundDealTimers.push(coinCleanupTimer);
        }
      });

      // Dock 3D Stage-Lift (0.84s + 100ms delay)
      dockContainer.classList.remove('dock-dealing');
      void dockContainer.offsetWidth;
      dockContainer.classList.add('dock-dealing');
      const dockCleanup = setTimeout(() => {
        dockContainer.classList.remove('dock-dealing');
      }, 1050);
      roundDealTimers.push(dockCleanup);

      // Staggered 3D Barrel-Roll Vortex Card Deal (340ms base + 105ms stagger, 0.82s duration)
      cardElements.forEach((card, idx) => {
        const isEven = idx % 2 === 0;
        const delayMs = 340 + (idx * 105);
        const dealX = isEven ? -90 : 90;
        const dealRY = isEven ? -260 : 260;
        const dealRZ = isEven ? -24 : 24;

        card.style.setProperty('--deal-delay', `${delayMs}ms`);
        card.style.setProperty('--deal-x', `${dealX}px`);
        card.style.setProperty('--deal-ry', `${dealRY}deg`);
        card.style.setProperty('--deal-rz', `${dealRZ}deg`);
        card.classList.add('card-dealing');

        const onCardEnd = (e) => {
          if (e.target === card && e.animationName === 'card3DFunkDeal') {
            card.classList.remove('card-dealing');
            card.removeEventListener('animationend', onCardEnd);
          }
        };
        card.addEventListener('animationend', onCardEnd);

        const fallbackCleanup = setTimeout(() => {
          card.classList.remove('card-dealing');
          card.removeEventListener('animationend', onCardEnd);
        }, delayMs + 1020);
        roundDealTimers.push(fallbackCleanup);
      });

      // Counter badge pop once the last card settles
      const totalEntranceMs = 340 + (cardElements.length * 105) + 680;
      const badgePopTimer = setTimeout(() => {
        counterBadge.classList.add('badge-pop');
        setTimeout(() => counterBadge.classList.remove('badge-pop'), 260);
      }, totalEntranceMs);
      roundDealTimers.push(badgePopTimer);

      // Synced 20%-slower funky synth intro
      playFunky3DIntro(zoneCount, cardElements.length);
    }

    function initGame() {
      isProcessing = false;
      celebrationOverlay.classList.remove('active');
      bslModal.classList.remove('active');
      fxBurstLayer.innerHTML = '';
      stopConfettiFountains();
      deselectCard();
      itemsDock.innerHTML = '';

      if (currentLevel === 2) {
        clothesZone.classList.remove('zone-hidden');
        mainGrid.setAttribute('data-columns', '3');
      } else {
        clothesZone.classList.add('zone-hidden');
        mainGrid.setAttribute('data-columns', '2');
      }

      const pickedVehicles = [...ITEM_BANK.vehicles]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      const pickedFood = [...ITEM_BANK.food]
        .sort(() => Math.random() - 0.5)
        .slice(0, ITEMS_PER_CATEGORY);

      let cardDeck = [...pickedVehicles, ...pickedFood];

      if (currentLevel === 2) {
        const pickedClothes = [...ITEM_BANK.clothes]
          .sort(() => Math.random() - 0.5)
          .slice(0, ITEMS_PER_CATEGORY);
        cardDeck.push(...pickedClothes);
      }

      currentItems = cardDeck.sort(() => Math.random() - 0.5);
      currentRoundStats = createFreshRoundStats(currentLevel, currentItems.length);

      updateBadge();

      const createdCards = currentItems.map(item => {
        const card = createCardElement(item);
        itemsDock.appendChild(card);
        return card;
      });

      animateRoundStart(createdCards);
    }

    function updateBadge() {
      const count = itemsDock.children.length;
      counterBadge.textContent = `${count} left`;
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.dataset.category = item.category;
      card.dataset.label = item.label;
      card.className = 'draggable-card';
      card.innerHTML = `
        <span class="card-icon">${getSvgEmojiImg(item.code, item.emoji, item.label)}</span>
        <span class="card-label">${item.label}</span>
      `;
      setupPointerDragAndTap(card);
      return card;
    }

    /* ============================================================
       POINTER DRAG-AND-DROP & TAP-TO-SELECT INTERACTIONS
       ============================================================ */
    function setupPointerDragAndTap(card) {
      let isDragging = false;
      let hasMovedSignificantly = false;
      let startX = 0, startY = 0;
      let activePointerId = null;

      card.addEventListener('pointerdown', (e) => {
        if (isProcessing || (e.button !== undefined && e.button !== 0)) return;
        markInteractionStart();
        // Immediately clear dealing animation class so drag/tap transforms never conflict
        card.classList.remove('card-dealing');
        isDragging = true;
        hasMovedSignificantly = false;
        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        card.classList.add('card-dragging');
        card.style.transition = 'none';
        card.style.transform = 'translate3d(0px, 0px, 0px) scale(1.22)';
      });

      card.addEventListener('pointermove', (e) => {
        if (!isDragging || e.pointerId !== activePointerId) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        if (Math.hypot(deltaX, deltaY) > 6) hasMovedSignificantly = true;
        
        card.style.transition = 'none';
        card.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0px) scale(1.22)`;
        highlightZoneUnderPoint(e.clientX, e.clientY, card);
      });

      const onPointerUp = (e) => {
        if (!isDragging || e.pointerId !== activePointerId) return;
        isDragging = false;
        card.classList.remove('card-dragging');
        clearZoneHighlights();
        
        try { card.releasePointerCapture(e.pointerId); } catch (err) {}

        if (!hasMovedSignificantly) {
          handleCardTap(card);
          card.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
          if (card !== selectedItemElement) {
            card.style.transform = 'translate3d(0px, 0px, 0px) scale(1)';
          }
          return;
        }

        card.style.pointerEvents = 'none';
        const elementBelow = document.elementFromPoint(e.clientX, e.clientY);
        card.style.pointerEvents = 'auto';

        const dropZone = elementBelow?.closest('.category-zone:not(.zone-hidden)') || findZoneByBoundingBox(e.clientX, e.clientY);

        if (dropZone) {
          checkMatch(card, dropZone, 'drag');
        } else {
          recordOffTargetDrop();
          snapBack(card);
        }
      };

      card.addEventListener('pointerup', onPointerUp);
      card.addEventListener('pointercancel', onPointerUp);
    }

    function findZoneByBoundingBox(clientX, clientY) {
      for (const zone of getActiveZones()) {
        const rect = zone.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
          return zone;
        }
      }
      return null;
    }

    function highlightZoneUnderPoint(clientX, clientY, currentCard) {
      currentCard.style.pointerEvents = 'none';
      const targetZone = document.elementFromPoint(clientX, clientY)?.closest('.category-zone:not(.zone-hidden)') || findZoneByBoundingBox(clientX, clientY);
      currentCard.style.pointerEvents = 'auto';

      getActiveZones().forEach(zone => {
        zone.classList.toggle('zone-hovered', zone === targetZone);
      });
    }

    function clearZoneHighlights() {
      getActiveZones().forEach(zone => zone.classList.remove('zone-hovered'));
    }

    function snapBack(card) {
      card.classList.remove('card-dragging');
      card.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      card.style.transform = 'translate3d(0px, 0px, 0px) scale(1)';
    }

    function handleCardTap(card) {
      if (selectedItemElement === card) {
        deselectCard();
      } else {
        deselectCard();
        selectedItemElement = card;
        activeCardTouchStart = Date.now();
        card.classList.add('card-selected-glow');
        playSound('select');
      }
    }

    function deselectCard() {
      if (selectedItemElement) {
        selectedItemElement.classList.remove('card-selected-glow');
        selectedItemElement = null;
      }
    }

    document.querySelectorAll('.category-zone').forEach(zone => {
      zone.addEventListener('click', () => {
        if (selectedItemElement && !isProcessing && !zone.classList.contains('zone-hidden')) {
          checkMatch(selectedItemElement, zone, 'tap');
        }
      });
    });

    function triggerZoneShake(zone) {
      if (!zone) return;
      zone.classList.remove('zone-shake', 'zone-entering', 'zone-correct-burst');
      void zone.offsetWidth;
      zone.classList.add('zone-shake');
      setTimeout(() => {
        zone.classList.remove('zone-shake');
      }, 480);
    }

    /* ============================================================
       "GETTING IT RIGHT" 3D BURST + BSL MODAL SEQUENCE
       ============================================================ */
    function triggerTargetZone3DBurst(targetZone) {
      if (!targetZone) return;

      targetZone.classList.remove('zone-correct-burst', 'zone-entering', 'zone-shake');
      void targetZone.offsetWidth;
      targetZone.classList.add('zone-correct-burst');
      setTimeout(() => {
        targetZone.classList.remove('zone-correct-burst');
      }, 600);

      const rect = targetZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const ring = document.createElement('div');
      ring.className = 'zone-shockwave-ring';
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      fxBurstLayer.appendChild(ring);
      setTimeout(() => ring.remove(), 660);

      const sparkleSymbols = ['✨', '⭐', '🌟', '✨', '⭐', '✨'];
      const dotColors = ['#34d399', '#fbbf24', '#38bdf8', '#f472b6'];
      const particleCount = 10;

      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.35;
        const dist = 72 + Math.random() * 68;
        const sx = Math.cos(angle) * dist;
        const sy = Math.sin(angle) * dist - 14;
        const sr = (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 140);

        const el = document.createElement('div');
        if (i < sparkleSymbols.length) {
          el.className = 'fx-sparkle';
          el.textContent = sparkleSymbols[i];
        } else {
          el.className = 'fx-sparkle-dot';
          const color = dotColors[i % dotColors.length];
          el.style.background = color;
          el.style.boxShadow = `0 0 12px ${color}`;
        }

        el.style.left = `${cx}px`;
        el.style.top = `${cy}px`;
        el.style.setProperty('--sx', `${sx.toFixed(1)}px`);
        el.style.setProperty('--sy', `${sy.toFixed(1)}px`);
        el.style.setProperty('--sr', `${sr.toFixed(0)}deg`);
        fxBurstLayer.appendChild(el);
        setTimeout(() => el.remove(), 720);
      }
    }

    function checkMatch(cardElement, targetZone, method = 'tap') {
      if (isProcessing) return;
      
      const targetCategory = targetZone.dataset.category;
      const isCorrect = cardElement.dataset.category === targetCategory;

      recordPlacementAttempt(cardElement, targetZone, isCorrect, method);

      if (isCorrect) {
        isProcessing = true;
        deselectCard();
        playSound('correct');
        triggerTargetZone3DBurst(targetZone);

        const cardRect = cardElement.getBoundingClientRect();
        const zoneRect = targetZone.getBoundingClientRect();
        const currentMatrix = window.getComputedStyle(cardElement).transform;
        let curTx = 0, curTy = 0;
        if (currentMatrix && currentMatrix !== 'none') {
          try {
            const parsed = new DOMMatrixReadOnly(currentMatrix);
            curTx = parsed.m41;
            curTy = parsed.m42;
          } catch (e) {}
        }

        const deltaX = (zoneRect.left + zoneRect.width / 2) - (cardRect.left + cardRect.width / 2);
        const deltaY = (zoneRect.top + zoneRect.height / 2) - (cardRect.top + cardRect.height / 2);

        cardElement.style.zIndex = '60';
        cardElement.style.pointerEvents = 'none';
        cardElement.style.transition = 'transform 0.36s cubic-bezier(0.32, 0, 0.2, 1), opacity 0.34s ease';
        cardElement.style.transform = `translate3d(${(curTx + deltaX).toFixed(1)}px, ${(curTy + deltaY).toFixed(1)}px, 80px) rotateY(360deg) rotateZ(24deg) scale3d(0.12, 0.12, 1)`;
        cardElement.style.opacity = '0';

        setTimeout(() => {
          cardElement.remove();
          updateBadge();
          if (itemsDock.children.length === 0) {
            finalizeCurrentRound();
          }
          showBslThankYouModal();
        }, 370);
      } else {
        snapBack(cardElement);
        deselectCard();
        triggerZoneShake(targetZone);
        playSound('incorrect');
      }
    }

    function showBslThankYouModal() {
      bslModal.classList.add('active');
      setTimeout(hideBslModal, 2050);
    }

    function hideBslModal() {
      bslModal.classList.remove('active');
      setTimeout(() => {
        isProcessing = false;
        if (itemsDock.children.length === 0) triggerGrandCelebration();
      }, 300);
    }

    function triggerGrandCelebration() {
      celebrationOverlay.classList.add('active');
      playSound('fanfare');
      startConfettiFountains();
    }

    /* ============================================================
       DUAL SIDE CONFETTI FOUNTAINS (#confettiCanvas)
       ============================================================ */
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;
    let confettiParticles = [];
    let confettiAnimId = null;
    let fountainIntervalId = null;

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);

    const CONFETTI_COLORS = [
      '#f59e0b', '#ef4444', '#10b981', '#3b82f6', 
      '#ec4899', '#8b5cf6', '#06b6d4', '#facc15'
    ];

    function createFountainParticle(originX, originY, angleDeg) {
      const angleRad = (angleDeg * Math.PI) / 180;
      const speed = 15 + Math.random() * 11;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angleRad) * speed + (Math.random() - 0.5) * 3,
        vy: Math.sin(angleRad) * speed,
        gravity: 0.42,
        drag: 0.985,
        wobble: Math.random() * 10,
        wobbleSpeed: 0.08 + Math.random() * 0.06,
        size: 7 + Math.random() * 7,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        opacity: 1,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12
      };
    }

    function launchFountainBursts() {
      if (!confettiCanvas) return;
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;
      const fountainY = h * 0.67;

      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.04, fountainY, -55 + (Math.random() - 0.5) * 28));
      }

      for (let i = 0; i < 9; i++) {
        confettiParticles.push(createFountainParticle(w * 0.96, fountainY, -125 + (Math.random() - 0.5) * 28));
      }
    }

    function updateAndRenderConfetti() {
      if (!confettiCtx || !confettiCanvas) return;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rotation += p.rotationSpeed;

        if (p.y > confettiCanvas.height - 20) {
          p.opacity -= 0.035;
        }

        if (p.opacity <= 0 || p.y > confettiCanvas.height + 50) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.scale(Math.cos(p.wobble), 1);
        confettiCtx.fillStyle = p.color;
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0 || fountainIntervalId) {
        confettiAnimId = requestAnimationFrame(updateAndRenderConfetti);
      }
    }

    function startConfettiFountains() {
      stopConfettiFountains();
      resizeConfettiCanvas();
      
      launchFountainBursts();
      launchFountainBursts();

      fountainIntervalId = setInterval(launchFountainBursts, 80);
      setTimeout(() => {
        if (fountainIntervalId) {
          clearInterval(fountainIntervalId);
          fountainIntervalId = null;
        }
      }, 2800);

      updateAndRenderConfetti();
    }

    function stopConfettiFountains() {
      if (fountainIntervalId) {
        clearInterval(fountainIntervalId);
        fountainIntervalId = null;
      }
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      confettiParticles = [];
      if (confettiCtx && confettiCanvas) {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    /* ============================================================
       EVENT BINDINGS & INITIALIZATION
       ============================================================ */
    document.getElementById('playAgainBtn').addEventListener('click', initGame);
    document.getElementById('resetButton').addEventListener('click', initGame);
    document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);
    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('levelToggleBtn').addEventListener('click', toggleLevel);

    document.getElementById('reportBtn').addEventListener('click', openReportModal);
    document.getElementById('celebrationReportBtn').addEventListener('click', openReportModal);
    document.getElementById('closeReportBtn').addEventListener('click', closeReportModal);
    document.getElementById('copyReportBtn').addEventListener('click', copyReportToClipboard);
    document.getElementById('clearSessionBtn').addEventListener('click', clearSessionHistory);

    initTheme();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
